# maxi-config-owned CodeRabbit review configuration.
#
# Distributed by scripts/sync-maxi-review.sh --manifest review-configs to the
# repos in that script's push inventory -- the declared list plus any repo
# already carrying an owned maxi-fix.yml, which is not yet every org repo
# (maxi-config#319). Edit it HERE, not in the target repo: the fan-out overwrites
# any copy carrying the marker above. To opt a repo out, add the opt-out marker
# to its copy -- $opt_out_marker in scripts/sync-maxi-review.sh names the exact
# string, and it is deliberately NOT written out here: this file is the payload
# every repo receives, so the literal appearing anywhere in it would mark every
# distributed copy as opted out and stop the fan-out for good after one run.
# `check_manifest_sources` enforces that.
#
# Schema: https://json.schemastore.org/coderabbit.json
language: en-US
early_access: false

# Load-bearing, not cosmetic. Inheritance is OFF by default, and CodeRabbit then
# uses only the highest-priority source — repository YAML (priority 2) would
# REPLACE Organization UI settings (priority 5) rather than merge with them,
# silently discarding whatever is configured there. With it on, this file merges
# with Central YAML and Organization UI: scalars here win, objects deep-merge,
# and path_instructions arrays are child-first with unique parent entries kept.
#
# Verify with `@coderabbitai configuration` on any PR: it prints the resolved
# config annotated with the source of each value.
inheritance: true

reviews:
  # Review volume is a throughput control, not a taste setting: the org merge bar
  # requires zero unresolved threads, so every comment is a gate.
  profile: chill
  # A bot must not gate merges on its own opinion; humans and the typed CI gates
  # decide.
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false

  path_filters:
    # Generated, vendored or machine-owned — findings here cannot be actioned by
    # the PR that surfaced them.
    - "!**/*.lock"
    - "!target/**"
    - "!**/dist/**"
    - "!**/*.wasm"
    - "!**/*.bin"
    # Fixture directories are ENUMERATED, not matched by a blanket
    # `!**/fixtures/**`. Codacy (.codacy.yml), qlty (.qlty/qlty.toml) and cubic
    # (cubic.yaml) all deliberately enumerate them for the same reason, and
    # CodeRabbit was the only reviewer still hiding the class wholesale.
    #
    # The blanket glob swallows directories that are not test data at all. The
    # worked example is maxi-core's src/daemon/fixtures/continuation_parity.json:
    # it is `include_str!`d into src/brain_parity.rs as DEFAULT_FIXTURES and
    # decides model accuracy and promotion. It is a production input whose
    # directory happens to be named `fixtures`, and CodeRabbit was skipping
    # review of it on the strength of the name alone.
    - "!**/.github/**/fixtures/**"
    - "!**/benches/**/fixtures/**"
    - "!**/benchmarks/**/fixtures/**"
    - "!**/tests/**/fixtures/**"
    # Retired by design. In maxi-core this single path accounted for 37 of one
    # PR's 38 unresolved threads, none of them high severity.
    - "!docs/archive/**"

  # LANES. Six reviewers run on these repos -- CodeRabbit, cubic, Codacy, Qlty,
  # Qodana and maxi-reviewer (Jules) -- and they were duplicating each other. On
  # maxi-core#3513 four independently reported the same worktree-dedup bug; on
  # #3455 two independently found the same two bugs. The org merge bar requires
  # zero unresolved threads, so a duplicate finding is not extra confidence, it
  # is an extra merge gate for a defect already reported.
  #
  # CodeRabbit leads on TEST-FIXTURE REALISM and WORKFLOW/YAML CORRECTNESS. It
  # is demonstrably the only reviewer here attacking whether a test actually
  # proves what it claims, which is why that lane is its own.
  #
  # The lane is a priority, not a blindfold -- every block below carries the
  # same escape hatch, and it must stay.
  path_instructions:
    - path: "**/*.rs"
      instructions: |
        Settled decisions across this org — do not re-litigate them:
        - `maxi_utils::serialize` is a set of benchmark-derived policies
          (msgpack/zstd/interning), NOT a style wrapper. Do not propose
          replacing it with bare serde_json or removing its indirection.
        - Hot paths are zero-copy by design. A "small" per-token or per-frame
          copy is a regression, not an acceptable simplification.
        - ANSI handling deliberately uses regex rather than a vte byte parser,
          because a byte parser corrupts emoji.
        - No ZWJ emoji in tool or category definitions; they break across
          serialization and byte parsing.
        - Internal git dependencies track `branch = "main"`, not pinned revs.
        YOUR LANE on Rust: whether the TESTS prove what they claim. Does the
        fixture resemble input the code will really see, or was it shaped to
        make the assertion pass? Does the test fail if the behaviour it covers
        regresses? Is a new branch, error path or state transition reachable by
        any test at all? Spend the budget there.

        Leave these to the reviewer that leads on them, unless you believe the
        finding is P1:
        - Daemon panic paths, async cancellation-safety in `tokio::select!`,
          DashMap lock discipline, unbounded allocation -- maxi-reviewer
          (Jules) leads.
        - Cross-target `src/lib.rs` / `src/main.rs` module parity and
          feature/`cfg(target_os)` gating -- cubic leads.
        - Complexity, function length, parameter counts, nesting, duplication
          -- Qlty leads, with metric history.
        - Style and naming -- rustfmt, clippy and Qodana lead.

        ESCAPE HATCH: if you find a defect you believe is P1 -- data loss, an
        exposed credential or token, a daemon-wide panic or deadlock, a
        security hole, or a CI gate that passes without doing its work --
        raise it whatever lane it belongs to, and say you are raising it
        out-of-lane. A missed P1 costs far more than a duplicate comment.
    - path: "**/*.py"
      instructions: |
        Mostly CI-critical scripts. Prioritise exit codes and error propagation:
        a script that swallows a failure and exits 0 turns a CI gate into a
        no-op. Flag any bare `except:`, any discarded subprocess return code,
        and any check that can pass by doing no work.
    - path: "**/*.sh"
      instructions: |
        Require `set -euo pipefail` or an explicit comment justifying its
        absence. Flag unquoted expansions and any command substitution whose
        failure is discarded — a guard that reads an empty value and then
        succeeds is worse than no guard.
    - path: ".github/workflows/**"
      instructions: |
        Focus on gates that report success without doing work: a job whose `if:`
        can never be true, a required check that path-filters out, or a
        `continue-on-error` masking the failure the job exists to catch.
        Fork-trust conditions must RESTRICT, not admit: use
        `github.event_name != 'pull_request' || (head.repo.full_name ==
        github.repository && ...)`. A `head.repo.full_name != github.repository`
        term inside an OR admits fork PRs.

        This is YOUR LANE -- workflow and YAML correctness is yours to lead on,
        so review it thoroughly rather than deferring. Two failure modes seen
        in practice and worth naming: a required check that is ABSENT is not a
        required check that PASSED, and grepping a job log for `::error::`
        matches the guard scripts' echoed error TEMPLATES rather than real
        emissions. Also check that the subcommand list a workflow gates on
        covers what its config declares -- a `cargo deny check` that omits
        `licenses` leaves deny.toml's allow-list enforced by nothing.

        ESCAPE HATCH: raise a suspected P1 regardless of lane, and say you are
        raising it out-of-lane.
    - path: "**/*.md"
      instructions: |
        Review prose for accuracy against the code it describes, not for style.
        Do not suggest rewording, heading changes or formatting preferences.

  auto_review:
    enabled: true
    # Drafts are not merge candidates, and reviewing them consumes the rate
    # limit that then denies review to PRs which are ready.
    drafts: false
    # Regex, and it must cover every default branch in the fleet -- this one
    # file is installed in all of them. Five repos (android-backend, nami,
    # waterkit, waterkit-1, waterui) default to `dev`, per the rollout ledger,
    # and pinning this to `main` alone would silently disable auto-review there:
    # enabled, configured, and never firing, which reads as "CodeRabbit found
    # nothing" rather than "CodeRabbit never looked".
    base_branches:
      - "^(main|master|dev)$"
    # maxi-config's own fan-out. These PRs carry a byte-for-byte copy of a diff
    # that was already reviewed on the maxi-config PR that changed it, opened
    # into ~31 repos at once -- so reviewing them spends this org's whole rate
    # limit re-deriving one verdict thirty-one times, and denies review to PRs
    # that have not been reviewed anywhere.
    #
    # BOTH keys, deliberately, because each is one rename away from failing
    # open and failing open here is SILENT -- 31 unwanted reviews and no error.
    # ignore_usernames is an EXACT match on the login, so it stops matching the
    # day the distributor's app identity changes; ignore_title_keywords is a
    # case-insensitive substring of the title, so it stops matching if
    # $pr_title in sync-maxi-review.sh is reworded. Two independent covers for
    # one PR, not one cover stated twice.
    #
    # Know what the username key costs: maxi-tools-auth[bot] is the org's
    # general automation identity, not the fan-out's alone -- it also opens the
    # `ci-budgets-sync` PRs that regenerate runner budgets. Those lose
    # CodeRabbit too. That is judged acceptable rather than overlooked: they
    # are generated files with no reviewable logic, and they keep maxi-reviewer
    # (whose head_ref guard excludes only maxi-config-sync/), so the review
    # gate still has a non-author reviewer on them and does not wedge. If a
    # future automation on this identity DOES want CodeRabbit, drop this key
    # and rely on the title key alone rather than widening the bypass.
    #
    # `ignore_labels` is NOT the third cover, because CodeRabbit has no such
    # key (checked against schema.v2.json); the label-shaped control is
    # `labels`, an allow/deny list evaluated for EVERY PR, and the fan-out
    # applies no labels anyway.
    #
    # The head branch would be the sharpest key of the three -- the fan-out
    # always pushes maxi-config-sync/<manifest> -- but auto_review filters on
    # BASE branches only, so it is not expressible here. maxi-review.yml and
    # the review gate key off it directly instead.
    ignore_usernames:
      - "maxi-tools-auth[bot]"
    ignore_title_keywords:
      - "sync maxi-review from maxi-config"
      - "sync review-configs from maxi-config"

chat:
  auto_reply: true
