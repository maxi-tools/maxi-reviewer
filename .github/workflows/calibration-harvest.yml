# Weekly reviewer-profile calibration harvest. Walks merged/closed PRs across
# the org, classifies inline review threads from the seven bot reviewers the
# org runs (codacy-production, coderabbitai, qltysh, chatgpt-codex-connector,
# cubic-dev-ai, github-advanced-security, maxi-reviewer), and publishes
# `reviewer-profiles.json` as a release asset on the rolling tag
# `reviewer-profiles-latest` so consumers fetch one URL with no checkout.
#
# The selector (T3 in the issue #17 follow-up plan) consumes this asset. The
# asset must also be valid when absent — the selector's tolerance for a
# missing profile is the reason this workflow does not gate the merge queue,
# only the rolling tag.
#
# Self-hosted, not X64-pinned: see maxi-config#649 for the X64 vs ARM64 vs
# generic-Linux trade. This job does not run user-supplied code; it only
# queries the GitHub GraphQL API and writes two JSON files. No checkout, no
# pnpm install, no dist verification, so the runner-type constraint that
# exists for `ci.yml` and `issue-17-regression.yml` does not apply.

name: Calibration Harvest

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Late enough that the weekend's merged PRs are
    # in the harvest window, early enough that the result is in `latest` before
    # Monday's standup.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      window_days:
        description: "Trailing window in days (default 30)."
        required: false
        default: "30"
      max_pulls:
        description: "Maximum PRs to scan (default 500)."
        required: false
        default: "500"
      dry_run:
        description: "Set to 1 to skip the release publish and write to /tmp."
        required: false
        default: "0"

permissions: {}

concurrency:
  # Two concurrent harvest runs would race on the same rolling tag and one
  # of them would lose its asset. The group serialises across schedules and
  # manual dispatches, so a backfill cannot stomp a fresh run.
  group: calibration-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    permissions:
      # `write`, and ONLY here: the rolling `reviewer-profiles-latest`
      # release is cut with the native GITHUB_TOKEN, whose write is scoped to
      # THIS repository. The App token below stays `contents: read` because
      # its grant is org-wide — `permission-contents: write` on it would hand
      # every job that reads this workflow push access to all 75 repos in the
      # org. Repo-scoped write for the one step that needs it; org-wide read
      # for the cross-repo REST walk that needs that.
      contents: write
      # The org-wide walk uses REST (`repos.listForOrg` → per-repo
      # `pulls.list`) followed by per-repo GraphQL for review threads
      # and PR commits. None of those need a `permissions:` entry on
      # the GITHUB_TOKEN — metadata read is implicit, and the App token
      # below (the only one that touches the cross-repo APIs) is
      # explicitly granted `permission-metadata: read` and
      # `permission-pull-requests: read`. (Earlier drafts requested
      # `issues: read` because the original implementation used
      # `search(query, type: ISSUE)` for the cross-org walk, but the
      # `maxi-tools-auth` App manifest does NOT declare `issues` and
      # the org-wide installation does not grant it — the request
      # returned HTTP 422 "The permissions requested are not granted to
      # this installation." The pivoted REST walk replaces the search
      # call and only needs `metadata: read` on the App token. Note:
      # `metadata` is NOT a valid scope in the job's `permissions:`
      # block; the GITHUB_TOKEN has it implicitly, so we omit it here.)
    steps:
      - name: Resolve inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_WINDOW: ${{ inputs.window_days }}
          DISPATCH_MAX: ${{ inputs.max_pulls }}
          DISPATCH_DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "window_days=${DISPATCH_WINDOW:-30}"
              echo "max_pulls=${DISPATCH_MAX:-500}"
              echo "dry_run=${DISPATCH_DRY:-0}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "window_days=30"
              echo "max_pulls=500"
              echo "dry_run=0"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a token with org-wide metadata:read
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # No `repositories:` line — the App token inherits the org-wide
          # installation's grant, which is what the cross-repo REST walk
          # (`listForOrg` then per-repo `pulls.list`) needs.
          owner: maxi-tools
          # `metadata: read` is the only permission strictly required for
          # the REST enumeration (the `listForOrg` endpoint returns the
          # repos visible to the installation). We also request
          # `pull_requests: read` so the per-repo `pulls.list` and the
          # GraphQL `reviewThreads` / `commits` walks return data on
          # every member repo. We do NOT request `issues: read` because
          # the `maxi-tools-auth` App manifest does not declare `issues`
          # and the org-wide installation does not grant it — the token
          # mint then fails with HTTP 422. The release publish below
          # uses the native GITHUB_TOKEN (not this App token) precisely
          # so the App token's grant stays read-only at the org level.
          permission-contents: read
          permission-metadata: read
          permission-pull-requests: read

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Same reason as ci.yml: the harvest doesn't push, so the runner
          # shouldn't carry the credential into .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        # pnpm matches the lockfile's content-addressed layout; npm's flat
        # tree would force @actions/github to resolve differently and break
        # the bundle at the next ncc rebuild.
        run: |
          npm install -g pnpm@10
          pnpm install --frozen-lockfile

      - name: Build harvest bundle
        run: npx ncc build src/calibration-harvest.ts -o dist/calibration-harvest --source-map --license licenses.txt

      - name: Run harvest
        id: run
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_ORG: maxi-tools
          INPUT_WINDOW_DAYS: ${{ steps.inputs.outputs.window_days }}
          INPUT_MAX_PULLS: ${{ steps.inputs.outputs.max_pulls }}
          INPUT_DRY_RUN: ${{ steps.inputs.outputs.dry_run }}
        run: node dist/calibration-harvest/index.js

      - name: Verify profile shape
        # The downstream selector reads `reviewer-profiles.json` via raw fetch;
        # a malformed file would silently produce an empty routing table. The
        # smoke check is a Node one-liner so the workflow doesn't depend on jq
        # or python in PATH.
        env:
          REVIEWER_PROFILES_PATH: ${{ steps.run.outputs.profiles-path }}
        run: |
          node -e '
            const path = process.env.REVIEWER_PROFILES_PATH;
            const data = JSON.parse(require("fs").readFileSync(path, "utf8"));
            if (data.schema !== "maxi.review.v1.reviewer-profiles") {
              console.error("schema mismatch:", data.schema);
              process.exit(1);
            }
            const expected = [
              "codacy-production", "coderabbitai", "qltysh",
              "chatgpt-codex-connector", "cubic-dev-ai",
              "github-advanced-security", "maxi-reviewer"
            ];
            for (const bot of expected) {
              if (!data.reviewers[bot]) {
                console.error("missing reviewer:", bot);
                process.exit(1);
              }
            }
            // A structurally valid file full of zeroes is the failure this
            // check missed the first time. #133 published exactly that: seven
            // reviewers, correct schema, 6358 samples, and every accept rate
            // 0% because every commit fetch was throwing. Shape alone cannot
            // tell that apart from a real measurement — the counts can.
            let known = 0, unknown = 0;
            for (const bot of expected) {
              const o = data.reviewers[bot].overall || {};
              known += o.n || 0;
              unknown += o.unknownN || 0;
            }
            if (known === 0 && unknown > 0) {
              console.error(
                "every one of " + unknown + " findings has an unknown outcome: " +
                "the harvest measured nothing, so every accept rate would be 0% " +
                "over an empty denominator. Refusing to publish."
              );
              process.exit(1);
            }
            if (unknown > known) {
              console.error(
                "::warning::" + unknown + " unknown vs " + known + " known outcomes; " +
                "the commit walk is failing on most PRs"
              );
            }
            console.log("reviewer-profiles.json OK:", Object.keys(data.reviewers).length, "reviewers,", data.windowDays, "day window,", known, "measured,", unknown, "unmeasurable");
          '

      - name: Publish release
        if: ${{ steps.inputs.outputs.dry_run != '1' }}
        env:
          # The NATIVE token, not the App token. `gh release delete/create`
          # needs contents:write, and this one carries it for this repository
          # only (see the permissions: block). The App token is minted
          # org-wide for the cross-repo walk and is deliberately read-only
          # — cutting a release with it would require org-wide write.
          GH_TOKEN: ${{ github.token }}
          PROFILES_PATH: ${{ steps.run.outputs.profiles-path }}
          CALIBRATION_PATH: ${{ steps.run.outputs.calibration-path }}
        run: |
          set -euo pipefail
          # Idempotent: delete the existing release and tag, then re-cut. The
          # data file's `generatedAt` is the version; the tag is just a
          # pointer at the most recent publish.
          if gh release view reviewer-profiles-latest >/dev/null 2>&1; then
            echo "Deleting existing reviewer-profiles-latest release"
            gh release delete reviewer-profiles-latest --yes --cleanup-tag
          fi
          gh release create reviewer-profiles-latest \
            --title "reviewer-profiles-latest" \
            --notes "Auto-generated per-reviewer calibration profile. See reviewer-profiles.json for the routing data and calibration.json for the per-rule / per-severity / per-path report over maxi-reviewer's own artifacts." \
            --target "$GITHUB_SHA" \
            "$PROFILES_PATH" \
            "$CALIBRATION_PATH"
          echo "Published reviewer-profiles-latest with $(basename "$PROFILES_PATH") and $(basename "$CALIBRATION_PATH")"

      - name: Upload artifacts on dry-run
        if: ${{ steps.inputs.outputs.dry_run == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calibration-harvest-dry-run
          path: |
            /tmp/reviewer-profiles.json
            /tmp/calibration.json
          retention-days: 7
