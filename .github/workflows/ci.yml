name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Nothing in this workflow writes to GitHub — it checks out, installs, lints,
# builds, tests, and scans. Without a block the token inherits the repository
# default, which on this org is read/write, so every `npm install` lifecycle
# script in both jobs ran next to a token that could push. Declared here as the
# floor and narrowed per job below.
permissions:
  contents: read

jobs:
  ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: read
      # SonarCloud reads the PR's base ref and number to attach analysis to the
      # right pull request. Read is enough: the decoration comment is posted by
      # the SonarCloud app under its own identity, not by this token.
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Prettier Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Workflow policy tests
        run: python3 tests/test_workflow_policy.py

      # Presence check only, so the credential is scoped to this step and the
      # scan below rather than every step in the job. A job-level `env` would
      # hand SONAR_TOKEN to `npm install` lifecycle scripts and every build and
      # test command that follows.
      #
      # The guard cannot read `secrets` directly: that context is unavailable in
      # an `if:` expression, and referencing it there makes GitHub reject the
      # whole workflow at parse time — the startup failure that meant this file
      # created zero jobs on all 100 of its previous runs.
      - name: Check for a SonarCloud token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud Scan
        if: ${{ steps.sonar.outputs.present == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # A fork PR's token is read-only regardless, but stating it keeps the two
    # jobs auditable side by side and stops the fork lane quietly widening if
    # the repository default ever changes.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Prettier Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Workflow policy tests
        run: python3 tests/test_workflow_policy.py
