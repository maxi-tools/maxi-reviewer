name: Issue 58 verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Record full-repository Prettier baseline
        continue-on-error: true
        run: npm run format:check
      - name: Prettier check changed files
        run: npx prettier --check src/review-pr.ts tests/review-pr.test.ts tests/index.test.ts docs/superpowers/specs/2026-07-31-empty-review-failure-design.md docs/superpowers/plans/2026-07-31-empty-review-failure.md .github/workflows/issue-58-regression.yml
      - name: Lint
        run: npm run lint
      - name: Build action bundle
        run: npm run build
      - name: Record full unit-test baseline
        continue-on-error: true
        run: npm test
      - name: Run empty-review regression tests
        run: npm test -- tests/review-pr.test.ts tests/index.test.ts
      - name: Record full coverage baseline
        continue-on-error: true
        run: npm run coverage
      - name: Run empty-review regression coverage
        run: npx vitest run --coverage tests/review-pr.test.ts tests/index.test.ts
      - name: Verify checked-in dist
        run: git diff --exit-code -- dist
      - name: Upload generated dist
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue-58-generated-dist
          path: dist
          retention-days: 1
