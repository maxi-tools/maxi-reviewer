name: Issue 58 verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Prettier check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build action bundle
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Coverage
        run: npm run coverage
      - name: Verify checked-in dist
        run: git diff --exit-code -- dist
      - name: Upload generated dist
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue-58-generated-dist
          path: dist
          retention-days: 1
