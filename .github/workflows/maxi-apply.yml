# maxi-config-owned Maxi apply workflow.
#
# Drop this into a repo's .github/workflows. It listens for `/maxi apply`
# comments on pull requests and applies Jules GitHub suggestion blocks to the PR
# branch when they apply cleanly.
name: Maxi Apply Suggestions
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: write

# Trust model:
# - `issue_comment` runs from the DEFAULT branch with secrets in scope, and
#   unlike a fork `pull_request` it is NOT covered by the outside-contributor
#   approval gate. Several repos on this manifest are PUBLIC. Before this gate
#   existed the content test below was the ONLY filter, so any GitHub user could
#   comment `/maxi apply` on a same-repository PR, occupy a persistent
#   self-hosted runner, and have the job push to the PR branch with
#   `contents: write`. Every maxi-tools org secret is `visibility: all`, so the
#   blast radius of a foothold here is the whole org secret set, not one repo.
# - The "Stop on unsafe fork PRs" step below does not close that. It tests the
#   PR HEAD REPO, which says where the code came from and nothing about who
#   typed the command; a same-repo PR passes it. It also runs only after the job
#   has been scheduled onto a runner and after `github.token` has been used.
# - There is exactly one trigger arm, `issue_comment`, and for that arm
#   `github.event.comment.author_association` describes the COMMENT AUTHOR --
#   the account being authorised. That correspondence is per-event and does not
#   generalise: under `issues: [assigned]`, `issue.author_association` names the
#   ISSUE author, not the assigner. If a trigger is ever added to this file,
#   re-derive which account its association actually names.
# - The gate is TWO layers, because one does not cover what the other does.
#   The job-level `if:` below is the shape that landed in maxi-tools/coreml-rs
#   `.github/workflows/claude.yml`; it rejects before a runner is occupied and
#   before any secret is in scope, which is what stops an anonymous commenter
#   from tying up the fleet. But `author_association` is not a permission:
#   MEMBER and COLLABORATOR are both reachable with read or triage access only,
#   and this job PUSHES. So the first step also asks the API for the
#   requester's actual permission and requires admin/maintain/write, the same
#   check `maxi-fix.yml` makes. An account that cannot push to the branch
#   itself must not be able to make this job push for it.
# - This authorises the INVOKER, not the REVISION. A trusted member commenting
#   `/maxi apply` on an outside contributor's pull request still passes, and the
#   job then handles outsider-authored code on a persistent machine. Runner
#   placement for that case is a separate change -- see
#   `ci/runner-routing.toml [lanes.linux-x64-ephemeral-review]`, which reserves
#   the ephemeral lane for "forks, Dependabot, and any author not in the policy".

jobs:
  apply:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/maxi apply') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    # Was ubuntu-latest. With the org's Actions allowance exhausted, hosted
    # jobs never get a runner assigned, so this command lane silently did
    # nothing on every invocation. Routed to the self-hosted Linux x64 fleet.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Authorize requester
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          # Fails CLOSED, and deliberately reports the two failure modes apart.
          # A 403 (this token may not read collaborator permission) and a 404
          # (the requester is not a collaborator at all) both arrive here, and
          # both must refuse: this job PUSHES, so "could not establish write
          # access" is not the same answer as "has write access". They need
          # different fixes, so they get different messages.
          #
          # `collaborators/{user}` (204/404) is NOT a substitute for
          # `collaborators/{user}/permission`, though it needs a weaker token:
          # for an org-owned repository the collaborator list includes members
          # with READ access, so a 204 does not mean push access and would let
          # back in exactly the accounts this step exists to exclude.
          err="$RUNNER_TEMP/maxi-apply-permission-error"
          if ! permission="$(gh api \
              "repos/${GITHUB_REPOSITORY}/collaborators/$REQUESTER/permission" \
              --jq '.permission' 2>"$err")"; then
            echo "::error::could not read $REQUESTER's permission on" \
              "$GITHUB_REPOSITORY; refusing rather than assuming write access." \
              "$(tr '\n' ' ' < "$err")"
            exit 1
          fi
          case "$permission" in
            admin|maintain|write)
              ;;
            *)
              echo "::error::/maxi apply requires write permission;" \
                "$REQUESTER has '$permission'"
              exit 1
              ;;
          esac

      - name: Read PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          pr=$(gh api "$PR_URL")
          {
            echo "head_repo=$(printf '%s' "$pr" | jq -r '.head.repo.full_name')"
            echo "head_ref=$(printf '%s' "$pr" | jq -r '.head.ref')"
            echo "head_sha=$(printf '%s' "$pr" | jq -r '.head.sha')"
          } >> "$GITHUB_OUTPUT"

      - name: Stop on unsafe fork PRs
        if: steps.pr.outputs.head_repo != github.repository
        run: |
          echo "Cannot safely push Jules suggestions to fork PRs."
          exit 1

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ github.token }}
          persist-credentials: true

      - name: Checkout maxi-config apply script
        uses: actions/checkout@v4
        with:
          repository: maxi-tools/maxi-config
          ref: main
          path: .maxi-config
          sparse-checkout: maxi-review
          persist-credentials: false

      - name: Collect Jules review comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" \
            --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/maxi-review-comments.json"

      - name: Apply structured Jules suggestions
        run: |
          JULES_REVIEW_COMMENTS_JSON="$(cat "$RUNNER_TEMP/maxi-review-comments.json")"
          export JULES_REVIEW_COMMENTS_JSON
          node .maxi-config/maxi-review/apply-suggestions.mjs | tee "$RUNNER_TEMP/maxi-apply-result.json"

      - name: Commit applied suggestions
        run: |
          if git diff --quiet; then
            echo "No Jules suggestions applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply Jules suggestions"
          git push

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f "$RUNNER_TEMP/maxi-apply-result.json" ]; then
            body=$(mktemp)
            {
              echo "Jules apply result:"
              echo
              echo '```json'
              cat "$RUNNER_TEMP/maxi-apply-result.json"
              echo '```'
            } > "$body"
          else
            body=$(mktemp)
            echo "Jules apply did not produce a result file." > "$body"
          fi
          gh issue comment "$PR_NUMBER" --body-file "$body"
