# maxi-config-owned Maxi PR review workflow.
#
# Drop this into a repo's .github/workflows/. It:
#   1. runs deterministic maxi-lint on changed files in lint-gate,
#   2. selects per-language Jules rules from central maxi-config,
#   3. feeds both the ruleset and lint findings to maxi-reviewer.
#
# The deterministic lint and AI review failure modes intentionally stay separate:
# lint-gate can be required as a fast merge gate, while review remains an
# advisory/commenting lane unless a repo explicitly requires its context.
name: Maxi Review
on:
  # The review jobs consume PR-only data. The jobs explicitly skip the
  # synthetic merge-group ref so their required-check entries are successful
  # without running review code against a non-PR event.
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# No workflow-level concurrency group.
#
# A workflow-level group is PR-wide and cancels the whole run, including runs
# whose `review` job is not eligible (a `labeled` event for some other label),
# so a run that reviews nothing could cancel the one that does (cubic, P1 on
# #621). Cancellation is declared per job instead, keyed so that only runs
# that would actually review the PR compete: see `review` below.
#
# FAN-OUT PULL REQUESTS ARE ATTESTED, NOT REVIEWED. `fanout-attest` runs first
# on a PR whose branch AND author say it is a fan-out, proves the diff is a
# byte-for-byte copy of already-reviewed upstream content, and posts the
# `advisory: maxi reviewer` context as success naming that upstream commit.
# Every other job here then skips. When the proof fails -- a hand edit, a
# conflict resolution, a deletion, a missing marker -- the PR is reviewed like
# any other. maxi-review/fanout-attest.py documents what counts as proof.

jobs:
  # The fan-out answer, settled before anything else spends a runner.
  #
  # Runs ONLY when both halves of the fan-out identity hold -- the branch is a
  # fan-out branch AND the author is the distributor App (ci/fanout-identity.toml).
  # Neither half alone: a branch name is chosen by whoever pushes it, and the
  # App also opens ordinary producer PRs, which must be reviewed. Titles are
  # never read; a title is free text.
  #
  # Identity only gets the PR INTO this job. What makes it skip review is the
  # proof in maxi-review/fanout-attest.py: the producer's marker names an
  # upstream commit on that repository's default branch, and every changed
  # file is that commit's content byte for byte (or, for ci/fanout-pin, only
  # the `uses:` sha moves, to the marker tip). Proven, it posts the
  # `advisory: maxi reviewer` context as SUCCESS on the head, describing the
  # upstream commit and PR whose review covers the content -- so the required
  # context is present and says truthfully why. Not proven, it says `review`
  # and the PR is reviewed like any other.
  #
  # Runs maxi-config's own script from maxi-config's default branch, never
  # code from the pull request: nothing is checked out from the PR, so the
  # self-hosted trust question (who may run PR code on the fleet) does not
  # arise here. The same-repository condition holds anyway, as on every job
  # in this file.
  #
  # Cancels per PR: a newer push supersedes this head, and the script also
  # refuses to post when the head moves under it (`superseded`).
  fanout-attest:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'maxi-tools-auth[bot]' &&
      (
        startsWith(github.head_ref, 'maxi-config-sync/') ||
        github.head_ref == 'ci/fanout-pin'
      )
    concurrency:
      group: maxi-review-attest-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.attest.outputs.verdict }}
    steps:
      - name: Create Maxi Review app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MAXI_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAXI_REVIEW_APP_PRIVATE_KEY }}
          owner: maxi-tools
          repositories: |
            maxi-config
            ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: write

      - name: Fetch the attestation script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: maxi-tools/maxi-config
          path: .maxi-config
          sparse-checkout: maxi-review
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Attest the fan-out, or hand it to review
        id: attest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          decision="$RUNNER_TEMP/fanout-attest.json"
          python3 .maxi-config/maxi-review/fanout-attest.py \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" --out "$decision"
          verdict=$(jq -r '.verdict' "$decision")
          case "$verdict" in
            attested)
              gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
                -f state=success \
                -f context='advisory: maxi reviewer' \
                -f description="$(jq -r '.description' "$decision")" \
                -f target_url="$(jq -r '.target_url' "$decision")" >/dev/null
              echo "posted 'advisory: maxi reviewer' success on ${HEAD_SHA}"
              ;;
            review|superseded) ;;
            *)
              echo "::error::fanout-attest.py returned verdict '${verdict}'"
              exit 1
              ;;
          esac
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          {
            echo "### Fan-out attestation: ${verdict}"
            echo
            jq -r '.reason' "$decision"
          } >> "$GITHUB_STEP_SUMMARY"

  lint-gate:
    # Superseded lint verdicts are worthless and restarting is cheap, so this
    # half keeps the cancel-on-push behaviour the workflow-level group used to
    # provide -- scoped to this job so it cannot reach `review`.
    #
    # Keyed on the ACTION as well as the PR, so a run only ever cancels work
    # doing the same job. With one group per PR, a `synchronize` run cancelled
    # the lint-gate of an `opened`/`reopened`/`ready_for_review`/`labeled` run;
    # that run's `review` then failed its lint-gate-success gate, and at the
    # time the `synchronize` run skipped `review` by design -- so the review
    # vanished with nothing replacing it. Same disappearance as the
    # workflow-level group produced, reached by a different path
    # (CodeRabbit, Major on #621). `review` now runs on `synchronize` too, but
    # keying on the action still keeps an unrelated event from cancelling it.
    #
    # Two pushes in a row still cancel each other, which is the point: both are
    # `synchronize`, so they are competing attempts at one task.
    concurrency:
      group: maxi-review-lint-${{ github.event.pull_request.number }}-${{ github.event.action }}
      cancel-in-progress: true
    # Same-repository only: this job uses org app credentials to install the
    # private maxi-lint scanner. It checks changed files only and fails solely
    # on deny-level deterministic findings.
    #
    # NOT on a fan-out pull request that `fanout-attest` proved to be a
    # byte-for-byte copy of reviewed upstream content. The distributor reaches
    # ~40 repos per change, so without this the org re-derives one verdict
    # forty times on the same self-hosted lane the repos' real CI is queued
    # on. A fan-out PR the attestation could NOT prove (a hand edit, a
    # conflict resolution) runs this job like any other PR: `fanout-attest`
    # says `review`, and nothing below can tell it from a producer PR.
    #
    # `!cancelled()` because `fanout-attest` is SKIPPED on every ordinary PR,
    # and GitHub skips a job whose need was skipped unless its `if` names a
    # status function. A FAILED attestation stops this job too: an
    # attestation that could not run is not evidence the PR needs a review,
    # and reviewing on a guess spends exactly the quota this exists to save.
    # The failure is visible as a red `fanout-attest`, which a rerun clears.
    #
    # NOR A DEPENDABOT RUN, for a different reason: it cannot work at all.
    # `secrets.APP_ID` / `APP_PRIVATE_KEY` are ordinary Actions secrets, and a
    # Dependabot-triggered run gets the DEPENDABOT secrets scope instead --
    # which this org has never populated. So both arrive as empty strings and
    # the app-token step below dies with `The 'client-id' (or deprecated
    # 'app-id') input must be set to a non-empty string`, ~5s in, having
    # scanned nothing. That is maxi-kvm#4-#7 exactly. A job that cannot reach
    # its scanner should SKIP and say so, not report the PR broken.
    #
    # Keyed on `github.actor`, not on the PR author, because the actor is what
    # GitHub keys the secrets restriction on: when a human pushes to a
    # dependabot/* branch the actor becomes that human, ordinary secrets ARE
    # available, and this lane should run normally. maxi-core's ci.yml keys its
    # eleven dependabot guards the same way, for the same reason.
    #
    # The review gate's non-author-review leg is what makes this safe to skip
    # rather than merely quiet: pr_review_gate.py waives THAT CONDITION ONLY on
    # a dependabot/* PR, because these two jobs are the only non-author
    # reviewers such a PR ever gets and no push can summon them -- the next
    # push is Dependabot's too. It does NOT waive the unresolved-threads
    # condition, which stays measurable via the human-push case above.
    #
    # pr_review_gate.py bypasses its non-author-review leg on the same fan-out
    # identity (ci/fanout-identity.toml), so an attested fan-out PR is not
    # stranded red for want of the reviewers this suppresses.
    needs: fanout-attest
    if: >
      !cancelled() &&
      github.event_name != 'merge_group' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (
        needs.fanout-attest.result == 'skipped' ||
        needs.fanout-attest.outputs.verdict == 'review'
      )
    # NOT gated on CI_ENFORCEMENT_MODE or `run-maxi-review`. It was, and
    # that is what left a non-strict repo with no review at all: the label
    # this condition required is applied by the roster step, which lives in
    # `review`, which requires the label, so nothing could ever start. The
    # scan is cheap and it is a merge gate, so it runs on every in-scope PR.
    # `review` dropped the condition too; see there.
    # Was ubuntu-latest. With the org's Actions allowance exhausted, hosted
    # jobs are rejected before a runner is assigned -- zero steps, no log, ~3s
    # to "failure" -- so this gate reported every PR broken without scanning a
    # single line. Same-repository PRs only (the `if` above), so this is org
    # code on the org's own fleet, not fork code.
    #
    # No arch label: the X64 pool was 14/14 busy with 71 queued on 2026-09-18
    # while ARM64 had a slot idle, and this job's tools (gh, python, cargo
    # for the pinned maxi-lint install) are present on both pools
    # (ci/runner-routing.toml, [lanes.linux-any]).
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    # Findings reach the downstream jobs through the artifact ONLY (the
    # "Upload maxi-lint findings" step below). There is deliberately no job
    # output / env channel any more: on a very large diff the findings JSON
    # exceeds the runner's argument limit, and the step that materialised it
    # from the environment died with "Argument list too long"
    # (maxi-config#1025, waterui#180, ~3,700 changed files). A file channel
    # has no size ceiling that a scan can plausibly reach.
    steps:
      - name: Create Maxi Review app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MAXI_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAXI_REVIEW_APP_PRIVATE_KEY }}
          owner: maxi-tools
          repositories: |
            maxi-config
            maxi-libs
            maxi-lint
            ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read

      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-code
          persist-credentials: false

      - name: Fetch maxi-review helper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: maxi-tools/maxi-config
          path: .maxi-config
          sparse-checkout: maxi-review
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      # Refuses a PR that edits a file the distributor overwrites. Deterministic,
      # so it belongs in this job rather than the AI lane -- and this job is the
      # one repos can require as a merge gate.
      #
      # The file list comes from the API, not `git diff`: the PR head above is
      # checked out at depth 1, so the base commit is absent and a diff would
      # fail. Widening the clone for every repo on every PR is a real cost for
      # a list the API already holds.
      #
      # --paginate matters. Without it a PR over 100 files is judged on its
      # first page and the gate passes on files it never saw -- silently, which
      # is the exact failure mode it exists to catch.
      - name: Refuse edits to centrally-owned files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: bash
        working-directory: pr-code
        run: |
          set -euo pipefail
          # The .maxi-config checkout above takes maxi-config's DEFAULT branch,
          # so this helper is whatever main holds right now -- deliberately, as
          # a pinned ref would freeze a centrally-owned check in 46 repos. The
          # cost is that a rollback of maxi-config main removes it under us, and
          # `python3 <missing>` fails with a bare ENOENT and no hint of why.
          helper="$GITHUB_WORKSPACE/.maxi-config/maxi-review/check-owned-files.py"
          if [ ! -f "$helper" ]; then
            echo "::error::$helper is missing from maxi-config's default" \
              "branch. This gate fails closed rather than passing a PR it" \
              "never checked; restore the helper on maxi-config main."
            exit 1
          fi
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
          # --labels=VALUE, not --labels VALUE: a label beginning with '-' is
          # parsed as an option in the separated form and argparse exits 2.
          python3 "$helper" \
            --files="$RUNNER_TEMP/changed-files.txt" \
            --labels="$PR_LABELS"

      # Refuses a PR that pins one maxi-tools repo to a commit of another.
      #
      # Reuses the file list and the helper checkout above rather than fetching
      # either again -- same sparse maxi-review/ tree, same default-branch
      # reasoning, same fail-closed-if-absent posture.
      #
      # FAILS ONLY ON A PIN THIS PR ADDED, and warns about the rest. Judging
      # the whole tree would fail every repo that already carries one, on its
      # next unrelated PR, which is how a guard gets labelled noise and turned
      # off. The failure mode worth eliminating is a NEW pin.
      #
      # "Added" is judged against the base branch's copy of each changed
      # manifest, not against the changed-file list: Cargo.lock is in the diff
      # of nearly every dependency bump, and a pre-existing pin in it must not
      # re-block each one. The checkout is depth 1 (see above), so the base
      # copies come from the contents API -- only for the changed
      # Cargo.toml/Cargo.lock files, which is usually none and rarely more
      # than two. A 404 is a file the PR created; any other failure is a
      # lookup this gate must not paper over, so it fails closed.
      #
      # A repo whose pin is load-bearing rather than lazy declares it in
      # `.github/intra-org-pins.tsv` (repo, what-ends-it, why) and stops
      # needing the `pin-intra-org` label on every PR that touches it. A
      # declared pin is still refused unless its revision is reachable from the
      # dependency's default branch -- that is the line between freezing to a
      # merged state, which a correctness pin needs, and freezing to a side
      # branch, which is always wrong. The reachability lookup uses GH_TOKEN
      # below and fails closed.
      #
      # An INHERITED pin needs no declaration: it is in Cargo.lock and in no
      # manifest this project owns, so a dependency pins it and the lock only
      # records what the resolver found. It is reported every run and never
      # blocks, because only the repository that WROTE it can remove it, and
      # refusing the consumer asks the wrong project to act.
      #
      # The merged-state check is BEST EFFORT with the token below, which is
      # scoped to maxi-config, maxi-libs, maxi-lint and the repository under
      # review. `compare` on a dependency outside that set 404s, and the gate
      # says so and allows the pin on its declaration alone rather than
      # reporting "not on the default branch" for a question it could not ask.
      # Making it a hard check means widening this token to read the
      # dependency repositories, which is a permissions decision rather than a
      # lint one.
      - name: Refuse intra-org dependency pins
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: bash
        working-directory: pr-code
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/.maxi-config/maxi-review/check-intra-org-pins.py"
          if [ ! -f "$helper" ]; then
            echo "::error::$helper is missing from maxi-config's default" \
              "branch. This gate fails closed rather than passing a PR it" \
              "never checked; restore the helper on maxi-config main."
            exit 1
          fi
          base_dir="$RUNNER_TEMP/base-manifests"
          mkdir -p "$base_dir"
          while IFS= read -r path; do
            case "${path##*/}" in Cargo.toml|Cargo.lock) ;; *) continue ;; esac
            mkdir -p "$base_dir/$(dirname "$path")"
            err="$RUNNER_TEMP/base-fetch.err"
            if gh api -H 'Accept: application/vnd.github.raw+json' \
                 "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${BASE_SHA}" \
                 > "$base_dir/$path" 2> "$err"; then
              continue
            fi
            rm -f "$base_dir/$path"
            if grep -q 'HTTP 404' "$err"; then
              continue  # not on the base branch: the PR created it
            fi
            echo "::error::could not fetch the base-branch copy of $path:"
            cat "$err"
            exit 1
          done < "$RUNNER_TEMP/changed-files.txt"
          python3 "$helper" \
            --files="$RUNNER_TEMP/changed-files.txt" \
            --base-dir="$base_dir" \
            --labels="$PR_LABELS"

      - name: Run maxi-lint deny gate
        id: maxilint
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          # Step-scoped git config instead of `git config --global`, so the
          # token never lands in a runner's persistent ~/.gitconfig where it
          # would outlive the run and break later anonymous fetches
          # (maxi-config#221). Scoped to maxi-tools so public deps still
          # resolve without a token; the trap removes it even on early exit.
          gitcfg="${RUNNER_TEMP:-$HOME}/gitconfig-maxi-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Caller-owned install root: the installer sweeps only its own source
          # checkout, so the executable must live somewhere that survives that
          # trap. Cleaned here on EXIT — the one and only deletion of this path.
          lint_install_root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/maxi-lint-install.XXXXXX")"
          trap 'rm -f "$gitcfg"; rm -rf "$lint_install_root"' EXIT
          umask 077
          cat > "$gitcfg" <<GITEOF
          [url "https://x-access-token:${GH_TOKEN}@github.com/maxi-tools/"]
            insteadOf = https://github.com/maxi-tools/
          GITEOF
          export GIT_CONFIG_GLOBAL="$gitcfg"
          # Pinned, unconditional install from the .maxi-config checkout —
          # NEVER from pr-code. A pull request must not supply the script that
          # installs the linter grading it; that is the same rule the review
          # job states below ("a PR must not be able to influence its own
          # review"), applied to the judge rather than the policy.
          #
          # Unconditional on purpose: an "only if absent" guard lets a runner
          # inherit maxi-lint from an earlier job, which is how verdicts stopped
          # being reproducible in the first place (maxi-core#3165).
          #
          # RULES is an explicit allowlist. The installer fails closed, naming
          # names, if the pinned maxi-lint does not carry every rule listed —
          # a stale binary otherwise drops unknown rules and still exits 0.
          RULES="serialization,ansi,yaml,queue,async,jsonl,reqwest-ssrf,audit,injection,backup-files,database,mcp-envelope,unwrap,timeout-fence,print-hygiene,hidden-spawn"
          sh .maxi-config/maxi-review/test_install_maxi_lint.sh
          CARGO_NET_GIT_FETCH_WITH_CLI=true \
            sh .maxi-config/maxi-review/install_maxi_lint.sh 61205f17cdf0fbd95b75d641ca38a24df9548102 "$RULES" "$lint_install_root"
          # Bind the executable explicitly. Resolving `maxi-lint` through PATH
          # would let a pre-existing binary shadow the pinned one — the workflow
          # prepends /opt/homebrew/bin ahead of Cargo's install dir, so the pin
          # would verify and scan with a binary we never installed.
          lint_bin="$lint_install_root/bin/maxi-lint"
          if [ ! -x "$lint_bin" ]; then
            echo "::error::installed maxi-lint unavailable; failing lint gate rather than passing without a scan (maxi-config#163)"
            exit 1
          fi

          to=""
          if command -v timeout >/dev/null 2>&1; then to="timeout 120"
          elif command -v gtimeout >/dev/null 2>&1; then to="gtimeout 120"; fi
          # A crashed/timed-out/empty scan must fail the gate, not fold to [].
          # A non-zero exit with valid JSON output still counts as a completed
          # scan (the deny-level fold below decides pass/fail).
          lint_status=0
          findings=$($to "$lint_bin" --format json pr-code) || lint_status=$?
          if [ -z "$findings" ] || ! printf '%s\n' "$findings" | jq -e 'type == "array"' >/dev/null; then
            echo "::error::maxi-lint produced no valid JSON findings (exit=$lint_status); failing lint gate (maxi-config#163)"
            exit 1
          fi
          printf '%s\n' "$findings" > all-findings.json
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" > pull-files-pages.json
          jq -s 'add | map(select(.status != "removed"))' pull-files-pages.json > pull-files.json
          python3 .maxi-config/maxi-review/filter-maxi-lint-findings.py \
            all-findings.json pull-files.json > filtered-findings.md
          # Derived from the SAME pull-files.json snapshot, not a second API
          # call: the file scope here and the line scope the reviewer's SARIF
          # gets from pull-files.json must name the same set of files.
          jq -r '.[].filename' pull-files.json > changed-files.txt
          python3 - all-findings.json changed-files.txt filtered-findings.md maxi-lint-findings.json maxi-lint-findings.md <<'PY'
          import json, sys

          raw = json.load(open(sys.argv[1]))
          changed = {line.strip() for line in open(sys.argv[2]) if line.strip()}
          markdown = open(sys.argv[3]).read()

          def path_of(finding):
              return (
                  finding.get("path")
                  or finding.get("file")
                  or finding.get("filename")
                  or ""
              ).removeprefix("pr-code/")

          def level_of(finding):
              return str(
                  finding.get("level")
                  or finding.get("severity")
                  or finding.get("decision")
                  or finding.get("kind")
                  or ""
              ).lower()

          scoped = []
          deny = []
          for finding in raw:
              path = path_of(finding)
              if path and path not in changed:
                  continue
              scoped.append(finding)
              if level_of(finding) in {"deny", "error", "blocking", "fail"}:
                  deny.append(finding)

          json.dump(scoped, open(sys.argv[4], "w"), indent=2)
          with open(sys.argv[5], "w") as out:
              if markdown.strip():
                  out.write("## maxi-lint findings\n\n")
                  out.write("Deterministic findings on files changed by this PR.\n\n")
                  out.write(markdown)
                  if not markdown.endswith("\n"):
                      out.write("\n")

          if deny:
              print(f"maxi-lint found {len(deny)} deny-level finding(s)")
              sys.exit(1)
          PY

      # Deliberately a SEPARATE step from the deny gate above, and deliberately
      # always(): the gate decides the verdict by its own exit status, and
      # `review` runs with always() and still needs the findings when that
      # verdict is a failure. Splitting them means publishing cannot change the
      # verdict, and the verdict cannot suppress the handoff.
      #
      # Publishes a marker only (see the step body for why there is no job
      # output carrying the findings any more). `review` and
      # `guaranteed-review` read the artifact uploaded below.
      - name: Publish maxi-lint findings handoff marker
        id: findings-output
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s maxi-lint-findings.json ]; then
            echo "no maxi-lint findings file on disk; the artifact step below will fail visibly"
            exit 0
          fi
          size="$(wc -c < maxi-lint-findings.json | tr -d '[:space:]')"
          # A summary, never the JSON. The findings themselves travel as the
          # artifact only.
          echo "published maxi-lint findings handoff: ${size} bytes go to the artifact"
          echo "json-bytes=${size}" >> "$GITHUB_OUTPUT"

      - name: Upload maxi-lint findings
        if: ${{ always() }}
        # Scoped to THIS step and never to the job: the deny gate above must
        # still fail the job on deny-level findings. By the time this runs the
        # verdict is already decided and this step only moves the result around.
        # Whether the org's shared artifact storage has room today is not a
        # property of the code under review. The upload is NOT continue-on-error
        # any more: since the job-output/env channel was removed
        # (maxi-config#1025), this artifact is the ONLY way findings reach
        # `review` and `guaranteed-review` in the same run, so a storage failure
        # here must be a visible red step -- never a silent review without a
        # scan. It still runs under always(): humans download it on a failed
        # gate, and it carries the .md a review body cannot.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maxi-lint-findings
          # Consumed by the `review` job in this same run and never needed
          # afterwards, but it inherited the 90-day default retention, so every
          # PR run left a copy behind. 73 had accumulated. Combined with much
          # larger images elsewhere in the org this exhausted the shared
          # artifact storage quota, which fails this gate -- and every other
          # artifact upload org-wide -- with "Artifact storage quota has been
          # hit". A same-run handoff does not need to outlive the run.
          retention-days: 1
          # pull-files.json rides along so `review` can scope the SARIF to
          # changed LINES with the same predicate (and the same /pulls/{n}/files
          # snapshot) that built maxi-lint-findings.md. The JSON above is only
          # scoped to changed FILES, because the deny gate grades whole files.
          path: |
            maxi-lint-findings.json
            maxi-lint-findings.md
            pull-files.json
          if-no-files-found: error
          # A re-run of this job stays inside the SAME workflow run, and
          # upload-artifact refuses to create a second artifact of the same
          # name unless told to overwrite. Since maxi-config#1025 made this
          # upload fatal and the SOLE findings channel, the default would
          # turn every re-run into a red lint-gate and skip both review jobs
          # -- a rerun-broken lane is a lane nobody can rescue.
          overwrite: true

  # The review the gate can always count on.
  #
  # `review-gate/non-author-review` requires a GitHub REVIEW from someone other
  # than the author, and the bots a trivial PR is sent to submit one only when
  # they have findings. A clean PR therefore got zero reviews and the gate
  # stayed red -- the one outcome the gate exists to prevent. A special case in
  # the gate was rejected for the same reason: it would let a PR merge with no
  # review at all.
  #
  # So maxi-reviewer posts one itself, from the scan `lint-gate` already did.
  # No model call. COMMENTED, never APPROVED: this lane did not read the diff,
  # and a posted review is evidence that the deterministic scan ran, not that a
  # reviewer was happy with the change.
  #
  # It was written when `review` excluded `synchronize` and required strict
  # mode or a label, so a PR opened before its lint passed was never reviewed.
  # `review` now runs on every non-draft head, but this job stays: it posts
  # without a model call, so the gate's non-author-review leg does not wait
  # on the AI reviewer's latency or availability. It runs on the first push
  # whose lint succeeds and then stops: one review per PR.
  #
  # Posted with the Maxi Review app token, so the author is
  # `maxi-reviewer[bot]` -- the login the roster asks for and the gate
  # intersects against. `github.token` would post as `github-actions[bot]`,
  # which the gate does not count when a roster is present.
  #
  # Skips drafts, same as `review` below and for the same reason: a draft is
  # not a merge candidate, and `pr_review_gate.py`'s own draft short-circuit
  # (`isDraft is True` -> pass) means posting a review here while a PR is
  # still draft buys nothing the gate needs -- it only spends a review this
  # job then has to explain skipping once the PR goes ready and is genuinely
  # asked for one. `success()` alone does not imply non-draft: lint-gate has
  # no draft exclusion of its own (it is a cheap deterministic merge gate that
  # should keep scanning every push, draft or not), so this job restates the
  # check rather than inheriting it.
  #
  # The decision logic is inlined rather than checked out. The fan-out copies
  # workflow files only, so a script fetched from maxi-config would not exist
  # on a consumer until the fan-out after the one that shipped this job, and
  # the PRs that fan-out opens are among the ones this job must review.
  # tests/test_post_deterministic_review.py holds the inlined block equal to
  # maxi-review/post-deterministic-review.py, which is what it tests.
  guaranteed-review:
    needs: lint-gate
    # Same scoping as lint-gate, restated rather than inherited. Requiring
    # lint-gate's success already skips this when lint-gate was skipped, but
    # the condition a reader checks to answer "why was this not reviewed"
    # should hold on its own.
    #
    # No `always()` and no `continue-on-error`. This job posts a review that
    # says the scan was clean when it finds nothing, so it must only run when
    # the scan actually succeeded. A failed lint-gate is a failed scan, and a
    # review posted over it would tell the gate a reviewer looked. The next
    # push reruns lint-gate, and this job posts then.
    #
    # `!cancelled() && needs.lint-gate.result == 'success'` and not a bare
    # `success()`: the implicit success() looks at EVERY upstream job, and
    # `fanout-attest` -- lint-gate's own need -- is skipped on every ordinary
    # PR, which would skip this job on exactly the PRs it exists for. Naming
    # lint-gate's result says the same thing about the one need that matters.
    if: >
      github.event_name != 'merge_group' &&
      !cancelled() &&
      needs.lint-gate.result == 'success' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (
        startsWith(github.head_ref, 'maxi-config-sync/') == false ||
        github.event.pull_request.user.login != 'maxi-tools-auth[bot]'
      )
    # Serialise per PR, and do not cancel. Two events on the same pull request
    # (an open and a synchronize, or two labels) can both be eligible, and both
    # would read an empty review list and both would POST. The gate needs one
    # review, not two, and a cancelled run is not a posted one. The group name
    # is this job's own: it must not share `review`'s group, or a queued
    # guaranteed review would hold the AI review behind it and vice versa.
    #
    # `|| github.ref` keeps queue entries from serialising against each other
    # (and against the PR they came from): a merge_group event has no
    # `pull_request` payload, so a bare `pull_request.number` collapses every
    # queue entry into one `maxi-review-guaranteed-` lane and turns the
    # queue sequential. On the synthetic merge-group ref the key falls back
    # to `github.ref`, distinct per entry, same shape review-gate.yml uses.
    concurrency:
      group: maxi-review-guaranteed-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Create Maxi Review app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MAXI_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAXI_REVIEW_APP_PRIVATE_KEY }}
          owner: maxi-tools
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Download maxi-lint findings
        # The scan result, from the artifact lint-gate uploads. This used to
        # read the findings out of a job output passed through the
        # environment, which overflowed the runner's argument limit on a
        # large diff and killed the whole job ("Argument list too long",
        # maxi-config#1025) -- the artifact has no such ceiling, and there is
        # no env fallback to fall back to any more.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maxi-lint-findings
          path: .maxi-lint-findings

      - name: Post the guaranteed review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"

          # Both login spellings, matching REVIEWER_LOGINS in the decision
          # block. Kept here as data rather than re-derived, so the re-read
          # check below and the decision agree on who counts.
          REVIEWER_LOGINS='["maxi-reviewer[bot]","maxi-reviewer"]'

          findings="$RUNNER_TEMP/guaranteed-review-findings.json"
          changed="$RUNNER_TEMP/guaranteed-review-changed.json"
          reviews="$RUNNER_TEMP/guaranteed-review-reviews.json"
          decision="$RUNNER_TEMP/guaranteed-review-decision.json"

          # The scan result, from the artifact lint-gate uploads. An absent or
          # empty artifact is a scan that did not complete -- lint-gate's
          # upload fails visibly when it has nothing to upload, and the
          # download above fails with it. Reviewing that as clean would report
          # a scan that never happened, so it is a failure.
          if [ ! -s .maxi-lint-findings/maxi-lint-findings.json ]; then
            echo "::error::lint-gate published no findings artifact; refusing to review without a scan"
            exit 1
          fi
          cp .maxi-lint-findings/maxi-lint-findings.json "$findings"

          # Changed files, from the compare API. NOT `--paginate`: pagination
          # repeats the whole compare payload on every page and only the
          # `files` array advances, so paginating and concatenating would count
          # the first page's files once per page. 300 is the per-page maximum;
          # past it the count stops growing and the review says so rather than
          # claiming a scan of files it did not count.
          gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}?per_page=300" \
            --jq '{files: [.files[] | select(.status != "removed") | .filename], total: (.files | length)}' \
            > "$RUNNER_TEMP/guaranteed-review-compare.json"
          jq '.files' "$RUNNER_TEMP/guaranteed-review-compare.json" > "$changed"
          total=$(jq '.total' "$RUNNER_TEMP/guaranteed-review-compare.json")
          counted=$(jq 'length' "$changed")
          if [ "$total" -ge 300 ]; then
            echo "::warning::the compare API returned its 300-file page cap; the review's file count covers the first page only"
          fi
          echo "counting $counted changed file(s) ($total including removed)"

          # `--paginate` emits ONE JSON DOCUMENT PER PAGE, and a pull request
          # with more than 100 reviews spans pages. Concatenating them is not
          # valid JSON, so read the pages into one array and flatten it.
          # `jq -s` rather than gh's own page-wrapping flag: gh refuses to
          # combine that flag with `--jq`, and this repo settled on `jq -s`
          # for exactly this case (tests/ci_economy_assets.rs pins it).
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            | jq -s 'add' > "$reviews"

          # The decision, inlined. See the job comment for why it is not a
          # checked-out script. tests/test_post_deterministic_review.py holds
          # this block equal to maxi-review/post-deterministic-review.py.
          python3 - \
            --event-name "$EVENT_NAME" --head-ref "$HEAD_REF" \
            --actor "$ACTOR" --author "$AUTHOR" \
            --findings "$findings" --changed-files "$changed" \
            --reviews "$reviews" --decision "$decision" <<'PY'
          from __future__ import annotations

          import json
          import sys
          from dataclasses import dataclass
          from typing import Any


          import argparse
          # The app the review is posted as. Both spellings, for the same reason
          # FANOUT_AUTHORS carries both: REST brackets a Bot login, GraphQL does not, and
          # "[" and "]" are not legal in a login, so the bracketed form is unspoofable.
          REVIEWER_LOGIN = "maxi-reviewer[bot]"
          REVIEWER_LOGINS = frozenset({REVIEWER_LOGIN, "maxi-reviewer"})

          REVIEW_STATE = "COMMENT"

          # The marker the expensive lane's own reviews carry (`COMMENT_MARKER` in
          # maxi-reviewer's src/github.ts). Present so a reader, and any later tooling
          # that keys on it, sees one kind of review from this author.
          COMMENT_MARKER = "<!-- maxi-review -->"

          # A GitHub review body is capped at 65536 characters. The review lists every
          # finding up to this budget and then says how many it did not list, so a long
          # scan truncates visibly rather than failing the POST -- a failed POST is a
          # missing review, which is the defect this step exists to close.
          BODY_BUDGET = 60000

          # Fan-out identity, held equal to ci/fanout-identity.toml by
          # tests/test_fanout_identity_is_one_copy.py. Duplicated rather than imported:
          # this file is what the workflow checks out, and select-roster.py is not on
          # that checkout's path. The test is the thing that keeps the two honest.
          #
          # The set is just the namespace today: `ci/fanout-pin` used to live
          # here too, on the rationale that the deterministic scan was a
          # review of a no-op. The rationale was wrong for the review the gate
          # counts -- a deterministic COMMENTED review is exactly what
          # closes `review-gate/non-author-review` on a clean PR, and on a
          # ci/fanout-pin branch the deterministic scan IS the only review
          # these PRs can get without paying for an AI pass. Dropping it lets
          # the author half (the auth bot, who alone can push the branch)
          # gate the lane, matching the workflow `if:` above.
          FANOUT_BRANCH_PREFIXES = ("maxi-config-sync/",)
          FANOUT_BRANCH_NAMES = ()
          FANOUT_AUTHORS = frozenset({"maxi-tools-auth", "maxi-tools-auth[bot]"})

          # Dependabot runs get the Dependabot secrets scope, which holds no app key, so
          # the token step cannot mint anything. Keyed on the ACTOR, matching the
          # workflow's other guards: a human pushing to a dependabot/* branch has
          # ordinary secrets and should be reviewed.
          DEPENDABOT_ACTORS = frozenset({"dependabot", "dependabot[bot]"})

          # The allowlist `lint-gate` pins, split by what maxi-lint's own README says
          # about each rule. CI-blocking rules deny; `print-hygiene` is the one advisory
          # rule in that list. A rule in neither set is `unknown` -- reported, never
          # dropped.
          DENY_RULES = frozenset({
              "serialization", "ansi", "yaml", "queue", "async", "jsonl",
              "reqwest-ssrf", "audit", "injection", "backup-files", "database",
              "mcp-envelope", "unwrap", "timeout-fence", "hidden-spawn",
          })
          WARN_RULES = frozenset({"print-hygiene"})

          DENY = "deny"
          WARN = "warn"
          UNKNOWN = "unknown"


          @dataclass(frozen=True)
          class Decision:
              """What the step should do. `body` is empty when `post` is false."""

              post: bool
              state: str
              body: str
              reason: str

              def as_dict(self) -> dict[str, Any]:
                  return {
                      "post": self.post,
                      "state": self.state,
                      "body": self.body,
                      "reason": self.reason,
                  }


          import json
          import sys
          from dataclasses import dataclass
          from typing import Any


          def eligible(event_name: str, head_ref: str, actor: str, author: str) -> bool:
              """Would this run be allowed to post? False means skip before any API call.

              `event_name` is checked rather than assumed, because a workflow trigger
              list grows and a step that posts on an event it was not written for would
              do it silently.
              """
              if event_name != "pull_request":
                  return False
              if actor in DEPENDABOT_ACTORS:
                  return False
              fanout_branch = (
                  head_ref.startswith(FANOUT_BRANCH_PREFIXES) or head_ref in FANOUT_BRANCH_NAMES
              )
              if fanout_branch and author in FANOUT_AUTHORS:
                  return False
              return True


          def already_reviewed(reviews: list[dict[str, Any]]) -> bool:
              """Has maxi-reviewer already submitted a counted review on this PR?

              Any state counts. A CHANGES_REQUESTED from the expensive lane is still a
              review, and posting a COMMENTED one beside it would not add a reviewer --
              it would add a second opinion that disagrees with the first by construction,
              since this one never reads the diff.
              """
              for review in reviews:
                  author = review.get("user") or {}
                  login = author.get("login", "") if isinstance(author, dict) else ""
                  if login in REVIEWER_LOGINS and review.get("state"):
                      return True
              return False


          def classify(finding: dict[str, Any]) -> str:
              """The level the workflow's deny gate cannot read off the JSON itself.

              maxi-lint emits no severity field, so the rule is the only signal. Unknown
              rules are reported as unknown rather than folded into deny: calling an
              unrecognised rule a denial would fail a gate on a rule nobody configured.
              """
              rule = str(finding.get("rule") or "")
              if rule in DENY_RULES:
                  return DENY
              if rule in WARN_RULES:
                  return WARN
              return UNKNOWN


          def _one_line(finding: dict[str, Any]) -> str:
              """One finding, one line, with the control characters a suggestion can
              carry stripped -- the same stance filter-maxi-lint-findings.py takes,
              because this line is going into a review body."""
              path = str(finding.get("file") or finding.get("path") or "(no file)")
              path = path.removeprefix("pr-code/")
              line = finding.get("line")
              rule = str(finding.get("rule") or "(no rule)")
              suggestion = str(finding.get("suggestion") or "").replace("\n", " ").strip()
              where = f"{path}:{line}" if isinstance(line, int) else path
              text = f"- {where} [{rule}] {suggestion}".rstrip()
              return "".join(ch for ch in text if ch >= " " or ch == "\t")


          def render_body(findings: list[dict[str, Any]], changed_files: list[str]) -> str:
              """The review text: a count plus the deny and warn items, or clean.

              Listed deny first, then warn, then unknown, because the deny items are what
              a reader acts on and a truncation must eat the least important first.
              """
              files = [f for f in changed_files if f.strip()]
              grouped: dict[str, list[dict[str, Any]]] = {DENY: [], WARN: [], UNKNOWN: []}
              for finding in findings:
                  if isinstance(finding, dict):
                      grouped[classify(finding)].append(finding)

              counts = {level: len(items) for level, items in grouped.items()}
              total = sum(counts.values())
              file_word = "file" if len(files) == 1 else "files"

              lines = [COMMENT_MARKER, "## Maxi Review", ""]
              if total == 0:
                  lines.append(
                      f"maxi-lint: clean on {len(files)} changed {file_word}."
                  )
              else:
                  lines.append(
                      "maxi-lint: "
                      f"{counts[DENY]} deny, {counts[WARN]} warn, "
                      f"{counts[UNKNOWN]} unrecognised on {len(files)} changed {file_word}."
                  )
                  for level, heading in (
                      (DENY, "Deny"),
                      (WARN, "Warn"),
                      (UNKNOWN, "Unrecognised rule"),
                  ):
                      items = grouped[level]
                      if not items:
                          continue
                      lines.append("")
                      lines.append(f"### {heading}")
                      lines.append("")
                      lines.extend(_one_line(item) for item in items)

              lines.append("")
              lines.append(
                  "_Posted from the lint-gate scan, without an AI review. "
                  "One review per pull request._"
              )
              body = "\n".join(lines) + "\n"

              if len(body) <= BODY_BUDGET:
                  return body
              return _truncate_body(lines, total)


          def _truncate_body(lines: list[str], total: int) -> str:
              """Cut a review body at a line boundary, saying what the cut cost.

              Two notes can be appended, and the reservation below is the max of both:

                * the omitted-count note, the normal case -- some findings did not fit;
                * the "every finding is listed above" note, for the degenerate case
                  where every finding fit and only the footer was cut. It is LONGER
                  than the count note at small totals (90 vs 84 chars at one finding),
                  so reserving only the count note lets a near-budget body exceed
                  BODY_BUDGET by a few characters.

              Every finding is exactly one line starting with "- " (headings and the
              footer are not), which is what makes the omitted count a count of lines
              rather than a re-render of the grouping.
              """
              note_template = (
                  "\n\n_...truncated; {omitted} of {total} findings omitted; "
                  "the lint artifact carries every finding._\n"
              )
              reserve = max(
                  len(note_template.format(omitted=total, total=total)),
                  len(
                      "\n\n_...truncated; every finding is listed above; "
                      "the lint artifact carries the full scan._\n"
                  ),
              )
              kept: list[str] = []
              size = 0
              for line in lines:
                  if size + len(line) + 1 > BODY_BUDGET - reserve:
                      break
                  kept.append(line)
                  size += len(line) + 1
              omitted = total - sum(1 for line in kept if line.startswith("- "))
              if omitted:
                  return "\n".join(kept) + note_template.format(omitted=omitted, total=total)
              return "\n".join(kept) + (
                  "\n\n_...truncated; every finding is listed above; "
                  "the lint artifact carries the full scan._\n"
              )


          def decide(
              findings: list[Any],
              changed_files: list[str],
              reviews: list[dict[str, Any]],
          ) -> Decision:
              """Post once, skip thereafter. The findings only affect the text."""
              if already_reviewed(reviews):
                  return Decision(False, "", "", "maxi-reviewer has already reviewed this pull request")
              clean = [f for f in findings if isinstance(f, dict)]
              return Decision(
                  True,
                  REVIEW_STATE,
                  render_body(clean, changed_files),
                  "no maxi-reviewer review on this pull request yet",
              )

          import json
          import sys

          # Parse one JSON file. `with`, and an explicit encoding.
          #
          # Both halves matter here and neither is stylistic: a bare
          # `json.load(open(p))` inside a generator expression leaves the file
          # to the garbage collector rather than closing it, and it decodes
          # with whatever the runner's locale says rather than UTF-8. Same
          # shape as `_load_json` in maxi-review/post-deterministic-review.py,
          # which is the script this block is a copy of.
          def load_json(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)

          # argparse with the SAME named flags as
          # maxi-review/post-deterministic-review.py, which this block is a
          # copy of. It used to read sys.argv positionally while the
          # standalone script had moved to named flags -- two parsers for one
          # interface, and nothing but a reader comparing them would notice.
          # The parity assertion in scripts/test_maxi_review_workflow.py stops
          # at `_load_json`, so it cannot see this; the flag NAMES are pinned
          # separately there for exactly that reason.
          import argparse

          parser = argparse.ArgumentParser()
          parser.add_argument("--event-name", required=True)
          parser.add_argument("--head-ref", required=True)
          parser.add_argument("--actor", required=True)
          parser.add_argument("--author", required=True)
          parser.add_argument("--findings", required=True)
          parser.add_argument("--changed-files", required=True)
          parser.add_argument("--reviews", required=True)
          # Required here, optional in the standalone script: this block is
          # only ever run inside a `run:` step whose next line reads
          # `$decision` from a file, so there is no stdout consumer to fall
          # back to.
          parser.add_argument("--decision", required=True)
          args = parser.parse_args()

          findings, changed, reviews = (
              load_json(p)
              for p in (args.findings, args.changed_files, args.reviews)
          )
          if not all(isinstance(v, list) for v in (findings, changed, reviews)):
              print("findings, changed files and reviews must all be JSON arrays", file=sys.stderr)
              raise SystemExit(2)
          if not eligible(args.event_name, args.head_ref, args.actor, args.author):
              outcome = Decision(False, "", "", "not an in-scope pull request")
          else:
              outcome = decide(findings, [str(p) for p in changed], reviews)
          with open(args.decision, "w", encoding="utf-8") as handle:
              json.dump(outcome.as_dict(), handle)
          PY

          post=$(jq -r .post "$decision")
          echo "decision: $(jq -r .reason "$decision") (post=$post)"
          if [ "$post" != "true" ]; then
            exit 0
          fi

          # Re-read immediately before posting. The concurrency group above
          # queues a second run rather than letting it overlap, but the
          # decision above was made against the reviews fetched at the start
          # of THIS run, and the run ahead of it may have posted since. A
          # review that landed in that gap must suppress this one: one review
          # per pull request, not one per queued run.
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            | jq -s 'add' > "$reviews"
          if jq -e --argjson logins "$REVIEWER_LOGINS" \
              '[.[].user.login] | any(. as $l | $logins | index($l))' \
              "$reviews" >/dev/null; then
            echo "a maxi-reviewer review landed while this run was queued; not posting another"
            exit 0
          fi

          jq -n \
            --arg sha "$HEAD_SHA" \
            --arg body "$(jq -r .body "$decision")" \
            --arg event "$(jq -r .state "$decision")" \
            '{commit_id: $sha, body: $body, event: $event}' \
            | gh api -X POST \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --input -

          # Read it back. A 2xx from the POST is not evidence the review
          # exists -- the gate reads the reviews list, so that is what is
          # checked.
          if ! gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --jq '.[].user.login' \
              | grep -qx 'maxi-reviewer\[bot\]'; then
            echo "::error::the review POST succeeded but no maxi-reviewer review is on the pull request"
            exit 1
          fi
          echo "posted a maxi-reviewer review"

  # Which OTHER review bots this pull request warrants. Every one of them is
  # mention-only (or API-only): they review nothing unless maxi-reviewer asks.
  # When `review` starts, this job selects by measured rules (calibration
  # LEDGER C-2026-10-08-01) and, only when a reviewer is borderline AND a
  # tie-breaker model is selected in reviewer-dispatch.prompt.toml [tiebreak]
  # (off by default), makes ONE call to that model. It posts a
  # "review started" comment that mentions exactly the selected reviewers --
  # nobody when nothing is worth calling; a failed tie-breaker adds nobody.
  # See maxi-review/reviewer-dispatch.py for what the model is shown
  # (metadata and numeric aggregates, never code) and
  # maxi-review/reviewer-registry.toml for who can be called.
  #
  # Runs exactly when `review` runs: the same `needs` and the same `if`, so a
  # fan-out pull request that `fanout-attest` proved gets no comment and no
  # mention (lint-gate skips, so this skips), and a draft gets none either.
  # tests/test_reviewer_dispatch_workflow.py evaluates the two guards against
  # each other so they cannot drift apart.
  #
  # Reads the GitHub API and maxi-config's own files only. Nothing is checked
  # out from the pull request, so the self-hosted trust gate is not in play.
  #
  # continue-on-error: the dispatch is advisory. A failure here must not hold
  # a merge; it is recorded in the job summary and the decision artifact.
  reviewer-dispatch:
    needs: lint-gate
    concurrency:
      group: maxi-review-dispatch-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'run-maxi-review') && format('-inert-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    if: >
      github.event_name != 'merge_group' &&
      !cancelled() &&
      needs.lint-gate.result == 'success' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (
        github.event.action != 'labeled' ||
        github.event.label.name == 'run-maxi-review'
      )
    continue-on-error: true
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Create Maxi Review app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MAXI_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAXI_REVIEW_APP_PRIVATE_KEY }}
          owner: maxi-tools
          repositories: |
            maxi-config
            ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          # write, not read: the kickoff is an issue comment on a pull
          # request. Under read the POST failed on #1082 (cause not captured
          # then; the script now records gh's stderr in post_error).
          permission-pull-requests: write

      - name: Fetch the dispatch script and registry
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: maxi-tools/maxi-config
          # maxi-config's main, named explicitly: with no ref, checkout of the
          # CURRENT repository takes the event's ref, so on a maxi-config pull
          # request it would run the PR's own dispatcher (observed on #1082).
          # The e2e sandbox sets the repository variable to a maxi-config
          # branch to exercise an unmerged dispatcher; only repository admins
          # can set it.
          ref: ${{ vars.MAXI_REVIEW_DISPATCH_REF || 'main' }}
          path: .maxi-config
          sparse-checkout: maxi-review
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Select reviewers and post the kickoff comment
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          # Unset in production. The e2e suite points it at a dead address to
          # prove the fail-closed path; an override never receives the key.
          REVIEWER_DISPATCH_ENDPOINT: ${{ vars.REVIEWER_DISPATCH_ENDPOINT }}
          DISPATCH_REF: ${{ vars.MAXI_REVIEW_DISPATCH_REF }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          # Only true while the dispatcher has not reached the ref yet: the PR
          # that introduces it runs its own workflow copy before the script
          # exists on maxi-config main. Say so instead of going red.
          if [[ ! -f .maxi-config/maxi-review/reviewer-dispatch.py ]]; then
            echo "::notice::reviewer-dispatch.py is not on maxi-config@${DISPATCH_REF:-main} yet; no dispatch"
            echo "### Reviewer dispatch: not deployed on maxi-config@${DISPATCH_REF:-main}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 .maxi-config/maxi-review/reviewer-dispatch.py \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" \
            --out "$RUNNER_TEMP/reviewer-dispatch.json" \
            --summary "$GITHUB_STEP_SUMMARY" --post

      # The job is continue-on-error, so a failed token mint, checkout or
      # dispatch would otherwise read as a quiet green. Say it in the summary
      # and leave a decision file that records the failure.
      - name: Record a dispatch that did not run
        if: ${{ failure() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/reviewer-dispatch.json"
          # No decision file means the dispatcher did not finish. It may have
          # failed before doing anything, or after triggering Codacy or posting
          # the kickoff, so the outcome is INDETERMINATE: mention and posted are
          # null (unknown), never an empty list or false that would contradict
          # a request that did go out. The PR's comments are the record.
          if [[ ! -s "$out" ]]; then
            jq -n --arg repo "$GITHUB_REPOSITORY" --argjson pr "$PR_NUMBER" --arg sha "$HEAD_SHA" \
              '{schema: 3, repo: $repo, pr: $pr, head_sha: $sha, status: "indeterminate",
                reason: "the dispatch job did not finish; check the PR for a kickoff comment",
                mention: null, posted: null}' \
              > "$out"
          fi
          {
            echo "### Reviewer dispatch: FAILED"
            echo
            echo "A step before or during dispatch failed (see the step log). Whether a kickoff comment or a"
            echo "Codacy trigger went out first is not known from here: check the PR."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::reviewer dispatch did not finish; its outcome is indeterminate"

      - name: Upload the dispatch decision
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewer-dispatch-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewer-dispatch.json
          if-no-files-found: warn
          # No retention-days: the org caps artifacts at 3 days, and asking for
          # more only adds a warning. The durable copy of the decision is the
          # record embedded in the kickoff comment.

  review:
    needs: lint-gate
    # Every non-draft head gets its own finished review. A prior review
    # cannot certify code added in a later push, and a verifier reads the
    # `advisory: maxi reviewer` context AT THE HEAD: a head with no context is
    # rejected as unreviewed, and no edit to the code can fix that. Measured
    # 2026-10-08 over 14 days: 473 of 874 verifier rejects named a missing
    # reviewer result at the head, 436 of them on ordinary producer PRs.
    #
    # Cancel per PR, so rapid pushes review only the newest head instead of
    # queueing a full AI review behind each superseded one. The cancelled run
    # leaves its context pending on a head nobody will merge; the new head gets
    # its own.
    #
    # Only runs that WOULD review compete for the group. A `labeled` event for
    # any label other than `run-maxi-review` starts a run whose review is
    # skipped below; without the run-id suffix its group entry would cancel a
    # review in flight on the same head and replace it with nothing. The
    # suffix gives those runs a group of their own, which cancels nothing.
    # The suffix condition and the `if:` below must describe the same events.
    #
    # The roster step in this job adds `run-maxi-review` itself (the lever for
    # claude-review and qwen-coder-local), but with the workflow's own
    # GITHUB_TOKEN -- observed as `github-actions[bot]` on voicemaci#171 --
    # and events made with that token start no workflow run, so a review does
    # not summon a second one.
    #
    # `|| github.ref` keeps queue entries apart, as on guaranteed-review.
    concurrency:
      group: maxi-review-ai-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'run-maxi-review') && format('-inert-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    # `!cancelled() && needs.lint-gate.result == 'success'`, NOT `always()`.
    # Under `always()` a FAILED lint-gate did not stop this job, so a PR that
    # could not pass deterministic maxi-lint still spent a full AI review: the
    # expensive half ran precisely when the cheap half had already found the
    # answer. Nor a bare `success()`: that looks at every upstream job, and
    # `fanout-attest` is skipped on every ordinary PR. Naming lint-gate's
    # result gates on the scan and nothing else.
    #
    # Fan-out PRs: an attested one never gets here, because lint-gate skips on
    # it, so the review is skipped through lint-gate -- that is the quota
    # guarantee, and tests/test_fanout_review_quota.py pins it by evaluating
    # these conditions. A fan-out PR the attestation could NOT prove is
    # reviewed like any other PR, deliberately: its diff is not the reviewed
    # upstream content, so nothing upstream covers it.
    #
    # No CI_ENFORCEMENT_MODE condition and no label requirement. Both used to
    # gate this job, and every repository carrying this file is `strict`, so
    # the condition decided nothing except in a repository that would then
    # get no review at all. `run-maxi-review` stays as an opt-in FORCE:
    # adding it re-runs the review on the current head -- after a reviewer
    # timeout, say -- without a push. It is never the only path.
    #
    # `github.event.pull_request.draft == false` is the other half of "spend
    # the AI budget when the PR is ready, not before". A draft is not a merge
    # candidate, so a review started while one is still draft is spent before
    # anyone can act on it. `ready_for_review` is a trigger type; marking a PR
    # ready starts a review on its head.
    if: >
      github.event_name != 'merge_group' &&
      !cancelled() &&
      needs.lint-gate.result == 'success' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (
        github.event.action != 'labeled' ||
        github.event.label.name == 'run-maxi-review'
      )
    continue-on-error: true
    # Was ubuntu-latest. With the org's Actions allowance exhausted, hosted
    # jobs are rejected before a runner is assigned -- zero steps, no log, ~3s
    # to "failure" -- so this gate reported every PR broken without scanning a
    # single line. Same-repository PRs only (the `if` above), so this is org
    # code on the org's own fleet, not fork code.
    #
    # No arch label: the X64 pool was 14/14 busy with 71 queued on 2026-09-18
    # while ARM64 had a slot idle, and this job's tools (gh, python, cargo
    # for the pinned maxi-lint install) are present on both pools
    # (ci/runner-routing.toml, [lanes.linux-any]).
    runs-on: [self-hosted, Linux]
    # Must exceed the reviewer step's 40, or the job cap fires first and the
    # step bound — the actual runner-release watchdog — can never take effect.
    # README: "use a step timeout-minutes of at least [hard deadline + cleanup
    # headroom] and a job timeout above that."
    #
    # 70 because this cap covers the WHOLE job, and everything ahead of the
    # reviewer step here is network-bound: two app-token mints, the maxi-lint
    # findings artifact download, the rules fetch, the per-language rule
    # selection, the PR-head checkout, and the built-in rules fetch and
    # staging. (The pinned maxi-lint cargo install is NOT in this job — it runs
    # in lint-gate, under its own 10-minute cap.) A job cancellation kills the
    # action mid-run, skipping exactly the graceful status cleanup the step
    # bound exists to preserve, so this cap must never be the one that fires.
    # 70 leaves 30 minutes of setup headroom above the 40-minute step bound,
    # and bounds the job far below GitHub's 6-hour default, which is what would
    # otherwise hold the runner if both inner bounds failed to fire.
    timeout-minutes: 70
    permissions:
      pull-requests: write
      issues: write
      contents: read
      statuses: write
    steps:
      - name: Create Maxi Review app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MAXI_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAXI_REVIEW_APP_PRIVATE_KEY }}
          owner: maxi-tools
          repositories: |
            maxi-config
            ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Download maxi-lint findings
        # The ONLY channel: the findings JSON and its human-facing .md travel
        # from lint-gate as this artifact. The env/job-output fallback that
        # used to sit below is gone -- on a very large diff the JSON exceeded
        # the runner's argument limit and the step died with "Argument list
        # too long" (maxi-config#1025), so a size-capped env channel cannot be
        # the primary handoff. A failure to download is therefore a failure of
        # the review's input, not a tolerable degradation: this step is no
        # longer continue-on-error, and the materialise step below fails
        # closed on a missing file.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maxi-lint-findings
          path: .maxi-lint-findings

      - name: Materialise maxi-lint findings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .maxi-lint-findings
          json=.maxi-lint-findings/maxi-lint-findings.json
          if [ -s "$json" ]; then
            echo "maxi-lint findings JSON came from the artifact"
          fi
          # The artifact is the only source. There is no env fallback to try:
          # findings past the argument limit cannot travel any other way, and
          # a missing file is an unknown, not a clean scan -- the same stance
          # the lint gate takes when its binary is missing: fail rather than
          # pass without a scan (maxi-config#163).
          if [ ! -s "$json" ] || ! python3 -c 'import json,sys; sys.exit(0 if isinstance(json.load(open(sys.argv[1])), list) else 1)' "$json"; then
            # Says what is actually wrong. The download step above is not
            # continue-on-error, so by here it either succeeded or the job
            # already stopped -- which means the likeliest cause of an empty or
            # unparseable file is not "the download failed" but "lint-gate
            # uploaded something that is not a findings array". (Codacy.)
            echo "::error::maxi-lint findings file is missing from the artifact, empty, or not a JSON array; failing review rather than reviewing without a scan (maxi-config#163)"
            exit 1
          fi
          # The .md is human-facing prose built from the same findings; the
          # reviewer reads the SARIF this step's successor writes, never the
          # Markdown. Losing it degrades the write-up, not the scan, so it is
          # worth a log line and not a failure.
          if [ ! -s .maxi-lint-findings/maxi-lint-findings.md ]; then
            echo "maxi-lint findings markdown is unavailable (human-facing only); proceeding on the JSON alone"
          fi

      - name: Fetch maxi-review rules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: maxi-tools/maxi-config
          path: .maxi-config
          sparse-checkout: maxi-review
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      # The findings cross into the reviewer as a FILE, named by path.
      #
      # This is the second half of maxi-config#1025. The JSON handoff was moved
      # onto the artifact because the findings could not travel through the
      # environment, and the Markdown that used to reach the reviewer still
      # did: a step output interpolated into `extra_instructions` becomes
      # INPUT_EXTRA_INSTRUCTIONS in the action's process environment, so a
      # 140,000-byte findings file made the action's own exec die with E2BIG.
      # The overflow had moved one step later, not gone.
      #
      # maxi-reviewer already reads analyzer output from PATHS -- it opens the
      # file with readFileSync -- so passing `opengrep_sarif` puts a filename
      # in the input and the bytes stay on disk. Nothing is capped, so nothing
      # is lost: every finding in the JSON becomes one SARIF result, and the
      # reviewer truncates for its own prompt budget the way it does the diff.
      #
      # AFTER the maxi-config checkout above, not before: the converter is read
      # from that checkout like every other helper in this job, so running it
      # earlier would fail on a file that has not been fetched yet.
      #
      # A conversion failure is fatal, like a missing artifact above. The SARIF
      # is the only channel the findings have now, so a failed conversion is a
      # review that would silently grade without a scan.
      #
      # CHANGED LINES ONLY. maxi-lint-findings.json is scoped to changed FILES
      # (the deny gate grades whole files), so converting it as-is handed the
      # reviewer every pre-existing violation on untouched lines. The converter
      # takes lint-gate's pull-files.json and applies
      # filter-maxi-lint-findings.py's own `on_changed_line` predicate -- the
      # one that builds the Markdown -- so the two can never disagree.
      - name: Convert maxi-lint findings for the reviewer
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s .maxi-lint-findings/pull-files.json ]; then
            echo "::error::lint-gate artifact carries no pull-files.json; cannot scope findings to changed lines, failing review rather than reviewing without a scan (maxi-config#163)"
            exit 1
          fi
          python3 .maxi-config/maxi-review/maxi-lint-to-sarif.py \
            .maxi-lint-findings/maxi-lint-findings.json \
            .maxi-lint-findings/pull-files.json \
            .maxi-lint-findings/maxi-lint-findings.sarif
          if [ ! -s .maxi-lint-findings/maxi-lint-findings.sarif ]; then
            echo "::error::maxi-lint findings SARIF is empty; failing review rather than reviewing without a scan (maxi-config#163)"
            exit 1
          fi

      - name: Select per-language rules from changed files
        id: rules
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          files=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | select(.status != "removed") | .filename')
          rules=$(printf '%s\n' "$files" | \
            bash .maxi-config/maxi-review/select-rules.sh .maxi-config/maxi-review/jules-rules)
          {
            echo "text<<JULES_RULES_EOF"
            echo "$rules"
            echo "JULES_RULES_EOF"
          } >> "$GITHUB_OUTPUT"

      # The roster selector: score (T2) -> band; fetch profiles; apply
      # min_complexity from routing; apply the accept-rate rule; publish
      # the decision as a commit status so both humans and the gate can
      # see it. This step ALWAYS runs on a PR the job did not skip, even
      # when the profile asset is absent -- the status names the gap.
      #
      # The status is what the review gate consumes in T4. The format
      # `asked=[...] skipped=<n>` is the contract; tests pin
      # the shape so a future refactor cannot silently change it.
      #
      # The file list is re-fetched here. It is the same data
      # `Select per-language rules from changed files` already paginated
      # for paths only, but the roster needs additions + deletions to
      # score, and merging the two into a single fetch would couple the
      # selector to the rules pipeline for the sake of one API call.
      # The PR file list is a few KB even on the busier PRs in this org.
      #
      # The profiles asset is OPTIONAL. T1 publishes a rolling tag the
      # workflow fetches here; absent or older than the cadence, the
      # selector degrades to raw metrics and the status names the gap.
      # `gh release download --pattern` against a tag whose name is the
      # rolling release is the shape T1 ships; the URL is interpolated
      # rather than hard-coded so the selector stays the source of truth.
      #
      # The lever application (labels, post-hoc bypass) lives at the END
      # of the step so the status is the FIRST thing published -- humans
      # reading the PR page see the decision before the label flips.
      - name: Select the review roster and publish `review-roster`
        id: roster
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          # The second half of the fan-out test. The prefix alone is
          # attacker-chosen: anyone able to push a branch could name it
          # maxi-config-sync/* and collapse the roster to maxi-lint.
          # REST/webhook spelling, so the bracketed Bot login.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # HEAD_SHA is interpolated here, not in `run:`, so the
          # workflow-script-injection guard sees only the env declaration
          # and the run-block uses `$HEAD_SHA` (#288).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          # Full file objects (filename + additions + deletions), paginated.
          # The list is small even on a 50-file PR; the file limit is a
          # 1 MB job-output ceiling and a 50-file PR is ~30 KB of JSON.
          files_json="$RUNNER_TEMP/roster-files.json"
          # `--paginate` emits a SEPARATE JSON value per page, and this
          # endpoint pages at 30 files, so `--jq` on its own wrote several
          # concatenated arrays -- not valid JSON -- for any PR over 30
          # files, and the selector rejected the whole input.
          #
          # `jq -s` reads those concatenated values into one array, which
          # `add` then flattens.
          #
          # gh has a flag that wraps the pages itself, and it is NOT used
          # here: gh refuses to combine that flag with `--jq`, and this
          # repo settled on `jq -s` for exactly this case in #136.
          # tests/ci_economy_assets.rs pins the choice by asserting this
          # file contains "jq -s" and does NOT contain that flag, as a
          # plain substring over the whole file -- so naming it even in a
          # comment fails the lane. That is why it is described rather
          # than spelled here.
          pages_json="$RUNNER_TEMP/roster-files-pages.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            > "$pages_json"
          jq -s 'add | map(select(.status != "removed"))' \
            "$pages_json" > "$files_json"
          echo "roster: $(jq 'length' "$files_json") changed file(s) across \
            $(jq -s 'length' "$pages_json") page(s)"

          profiles="$RUNNER_TEMP/roster-profiles.json"
          # T1 publishes a rolling tag named `reviewer-profiles` with one
          # asset `reviewer-profiles.json`. Until T1 ships, this fails
          # silently: the selector's `--profiles-path` is absent, the
          # status says `profiles=absent`, and the routing defaults carry
          # the decision. The `|| true` is load-bearing -- a 404 on a
          # tag that has not been published yet must NOT fail the gate.
          # The harvest publishes the rolling tag `reviewer-profiles-latest`
          # in maxi-tools/maxi-reviewer (its calibration-harvest.yml), with
          # assets reviewer-profiles.json and calibration.json.
          #
          # BOTH coordinates were wrong here. This read maxi-tools/maxi-config,
          # which has no releases at all, and it named no tag -- so even
          # against the right repo `gh release download` takes whichever
          # release was cut most recently rather than the rolling profile
          # tag. The `|| true` then reported the miss as `profiles=absent`,
          # which is why accept-rate routing has never once run and nothing
          # said so.
          #
          # A genuinely missing release or asset is still expected and must
          # not fail the gate. Anything else -- auth, rate limit, network --
          # fails loudly rather than masquerading as `absent`.
          dl_log="$RUNNER_TEMP/roster-profiles-download.log"
          if gh release download reviewer-profiles-latest \
               --repo maxi-tools/maxi-reviewer \
               --pattern 'reviewer-profiles.json' \
               --dir "$RUNNER_TEMP" > "$dl_log" 2>&1; then
            mv "$RUNNER_TEMP/reviewer-profiles.json" "$profiles"
          elif grep -qiE 'release not found|not found|no asset' "$dl_log"; then
            echo "roster: no published profiles asset yet -> profiles=absent"
            cat "$dl_log"
          else
            echo "::error::gh release download failed for a reason other than a missing asset"
            cat "$dl_log"
            exit 1
          fi

          # Run the selector. Stdout is the JSON the rest of the step
          # materialises. The script's exit status is non-zero on
          # malformed input, which fails the step -- the gate MUST have a
          # roster to consult, so a missing roster is a red build, not a
          # green one with an empty asked list.
          #
          # `python3` from PATH, NOT a hard-coded /opt/homebrew/bin/python3.12.
          # The Homebrew path is the macOS runner's convention, but this lane
          # also runs on Linux self-hosted runners (pearl-1 et al.) where the
          # Homebrew tree does not exist. PATH is exported at the top of this
          # step -- `/opt/homebrew/bin` first for the macOS pool, system paths
          # second -- so `python3` resolves to the right interpreter on every
          # runner. The hard-coded path was the cause of every roster-step
          # failure since the selector first shipped (#728, maxi-config#741).
          roster_json="$RUNNER_TEMP/roster.json"
          python3 \
            .maxi-config/maxi-review/select-roster.py \
              --files="$files_json" \
              --head-ref="$HEAD_REF" \
              --pr-author="$PR_AUTHOR" \
              --profiles-path="$profiles" \
              --repo-root=. \
              --allow-escalation > "$roster_json"

          # Step summary: humans read this in the run logs. The shape is
          # the same JSON the status publishes, plus the per-reviewer
          # reasons in two tables.
          {
            echo "## Review roster"
            echo
            echo "Status: \`$(jq -r .summary "$roster_json")\`"
            echo
            echo "- band: \`$(jq -r .band "$roster_json")\`"
            echo "- effective_band: \`$(jq -r .effective_band "$roster_json")\`"
            if [ "$(jq -r .band_escalated "$roster_json")" = "true" ]; then
              echo "- band_escalated: \`true\` ($(jq -r .escalation_reason "$roster_json"))"
            else
              echo "- band_escalated: \`false\`"
            fi
            echo "- profiles: \`$(jq -r .profiles "$roster_json")\`"
            age=$(jq -r .profiles_age_days "$roster_json")
            if [ "$age" != "null" ]; then
              echo "- profiles_age_days: \`$age\`"
            fi
            echo
            echo "### Asked"
            echo
            jq -r '.asked[] | "- **\(.reviewer)**: \(.reason)"' "$roster_json"
            echo
            echo "### Skipped"
            echo
            jq -r '.skipped[] | "- **\(.reviewer)**: \(.reason)"' "$roster_json"
          } >> "$GITHUB_STEP_SUMMARY"

          # RECONCILE THE LEVERS FIRST, THEN PUBLISH.
          #
          # This used to run the other way round -- status first, so a human
          # reading the PR face saw the decision before the label flipped.
          # That reads better and is wrong. `review-roster` is the
          # authoritative signal and T4 waits only for the reviewers it names
          # in `asked`, so publishing success before the label is reconciled
          # means a failed `--add-label` leaves the status asking for
          # claude-review while nothing can start it, and T4 waits for a
          # check that cannot arrive. A failed `--remove-label` is the
          # mirror: a stale label starts claude-review on a PR the roster
          # says to skip. Two ledgers, one of them wrong, and `|| true`
          # hiding which one.
          #
          # So: decide, reconcile, VERIFY by re-reading, then publish.
          #
          # `jq ... "$roster_json"` reads the FILE. This was
          # `echo "$roster_json" | jq -e ...`, which piped the PATH STRING
          # into jq; it failed to parse ("Invalid numeric literal"), so the
          # condition was false on EVERY run -- claude-review was never
          # labelled, and an existing label was always stripped. The lever
          # this block exists to pull had never once fired.
          #
          # The label is the SHARED lever for every workflow-gated reviewer:
          # claude-review AND qwen-coder-local (the local coder-model lane
          # added by t_6e9a6388) both consume `run-maxi-review`, and the
          # label fires when ANY of them is asked. Naming it `want_claude`
          # after the first consumer made sense when it was the only one;
          # with a second consumer it is the "any workflow reviewer wanted"
          # predicate. The variable is renamed below for that reason.
          want_reviewer=0
          if jq -e '.asked | map(select(.reviewer == "claude-review" or .reviewer == "qwen-coder-local")) | length > 0' \
               "$roster_json" >/dev/null; then
            want_reviewer=1
          fi

          has_label() { printf '%s\n' "$1" | grep -qx "run-maxi-review"; }

          label_ok=1
          if ! labels_now=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                              --json labels --jq '.labels[].name' 2>&1); then
            echo "::warning::could not read PR labels: $labels_now"
            labels_now=""
            label_ok=0
          fi

          # `gh pr edit` fails when the label does not exist in the repo.
          # `run-maxi-review` is reconciled nightly by
          # reconcile_repo_conformance.py, so its absence is a bug elsewhere
          # and not this step's to own -- but it has to be VISIBLE, which is
          # what the old `|| true` prevented.
          if [ "$label_ok" = "1" ]; then
            if [ "$want_reviewer" = "1" ] && ! has_label "$labels_now"; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --add-label run-maxi-review \
                || { echo "::warning::--add-label run-maxi-review failed"; label_ok=0; }
            elif [ "$want_reviewer" = "0" ] && has_label "$labels_now"; then
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --remove-label run-maxi-review \
                || { echo "::warning::--remove-label run-maxi-review failed"; label_ok=0; }
            fi
          fi

          # Re-read rather than trust the edit's exit status: an edit that
          # reported success without taking effect is exactly the case that
          # strands T4 on a check that never arrives.
          if [ "$label_ok" = "1" ]; then
            if ! labels_after=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                                  --json labels --jq '.labels[].name' 2>&1); then
              echo "::warning::could not re-read PR labels: $labels_after"
              label_ok=0
            elif [ "$want_reviewer" = "1" ] && ! has_label "$labels_after"; then
              echo "::warning::run-maxi-review still absent after --add-label"
              label_ok=0
            elif [ "$want_reviewer" = "0" ] && has_label "$labels_after"; then
              echo "::warning::run-maxi-review still present after --remove-label"
              label_ok=0
            fi
          fi

          # Publish the commit status. The description is the contract
          # T4 reads; the target_url points at this run so a reader who
          # lands on the PR page can land on the run.
          #
          # The description is bounded by the selector, not clipped here.
          # Clipping would leave a string that still starts with `asked=`
          # and no longer parses, and `parse_roster` fails that closed.
          summary=$(jq -r .summary "$roster_json")
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$label_ok" = "1" ]; then
            status_state=success
          else
            # The roster is still published -- a reader needs to see what was
            # decided -- but it must not report success while the label state
            # contradicts the reviewers it just asked for. The state carries
            # that; the suffix is a hint for a human reading the description.
            # GitHub rejects the POST above 140 characters, which is the
            # failure this step exists to avoid, so the hint is dropped when
            # it would not fit rather than failing the POST.
            status_state=failure
            if [ $(( ${#summary} + 19 )) -le 140 ]; then
              summary="$summary label=UNRECONCILED"
            fi
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$status_state" \
            -f context=review-roster \
            -f description="$summary" \
            -f target_url="$run_url" >/dev/null
          echo "posted review-roster=$summary (state=$status_state)"
          [ "$label_ok" = "1" ]

      # Looks ACROSS review rounds, which no single review can do. A
      # line-level reviewer is very good at "this line is wrong" and
      # structurally unable to say "this approach guarantees more of these" --
      # every finding is correct, every fix is correct, and the next round
      # produces another of the same shape. Emits nothing on a converging PR,
      # which is almost all of them.
      - name: Detect review churn
        id: churn
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          # PIPED, not passed as an argument. One real PR's comment payload
          # measured 910 KB against a 1 MB ARG_MAX on these runners, and the
          # PRs this step targets are the ones with the most comments -- so
          # argv would have failed to exec exactly where it is needed.
          #
          # `|| true` and the empty default below: this step may only ever ADD a
          # question to the review. A rate-limited call or a parse failure must
          # leave the review exactly as it would have been and never fail the
          # job -- the review is the product, this is a footnote on it.
          text=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" 2>/dev/null \
            | python3 .maxi-config/maxi-review/detect-review-churn.py 2>/dev/null \
            || true)
          # A RANDOM DELIMITER, because `$text` is PR comment bodies -- data an
          # attacker controls. With a fixed `CHURN_EOF`, a comment containing
          # that word on a line of its own closes the heredoc early, and every
          # line after it is parsed as a fresh `$GITHUB_OUTPUT` assignment:
          # arbitrary step outputs, set by anyone who can comment on a PR.
          # GitHub's own guidance for untrusted multiline output is a delimiter
          # the writer cannot predict. (maxi-reviewer, seen on the fan-out.)
          delim="CHURN_EOF_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          {
            printf '%s\n' "text<<$delim"
            printf '%s\n' "$text"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      # There is deliberately no "Prepare lint findings context" step here any
      # more. It existed to move the findings Markdown into a step output for
      # `extra_instructions`, which is the environment channel maxi-config#1025
      # exists to remove: the action turns that input into
      # INPUT_EXTRA_INSTRUCTIONS and its own exec dies with E2BIG on a large
      # diff. The findings reach the reviewer as the SARIF FILE named by
      # `opengrep_sarif` below, read off disk by the action itself.
      #
      # `rules` and `churn` stay, and both are bounded by construction rather
      # than by hope: `rules` is one rule file per language the PR touches
      # (select-rules.sh over the pinned jules-rules directory), and `churn`
      # emits integers and prose from detect-review-churn.py -- it is
      # deliberately forbidden from emitting any PR-authored byte, which is
      # also why it cannot grow with comment volume.

      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-code
          persist-credentials: false

      - name: Generate reviewer repo token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: reviewer-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: maxi-tools
          repositories: maxi-reviewer
          permission-contents: read

      - name: Fetch maxi-reviewer built-in rules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: maxi-tools/maxi-reviewer
          token: ${{ steps.reviewer-token.outputs.token }}
          # MUST match the `maxi-tools/maxi-reviewer@<sha>` pin below. These two
          # fetch the same repo: this one supplies the built-in rules, that one
          # runs the action that consumes them. Split them and the reviewer
          # grades with one revision's code against another revision's rules —
          # a mismatch nothing else in this workflow would surface.
          ref: 1c5e1d8dece75f724cc95a35c0908579ca6d8d80
          path: .maxi-reviewer-rules
          sparse-checkout: rules
          persist-credentials: false

      - name: Stage maxi-reviewer built-in rules
        run: |
          rm -rf rules
          mkdir -p rules
          cp -R .maxi-reviewer-rules/rules/. rules/
          # Fail closed: never source review policy from the PR branch — a PR
          # must not be able to influence its own review (maxi-config#163).
          if [ ! -f rules/rust.md ]; then
            echo "::error::pinned maxi-reviewer ref is missing rules/rust.md; refusing to fall back to PR-branch rules"
            exit 1
          fi

      # Pinned to maxi-reviewer v1.2.0's release-please merge commit: the
      # released action includes #159's OpenAI-compatible Jules-timeout
      # fallback. The built-in rules checkout above uses the same commit.
      # Keep the two pins together when upgrading.
      # Which Jules account reviews this PR.
      #
      # maxi-reviewer takes ONE jules_api_key, so alternating has to happen
      # here. Two accounts exist, and until now every review across ~90 repos
      # went to the same one -- which is the shape of the failure this workflow
      # keeps reporting: "No review after 15 min: Jules never replied."
      #
      # The index is (PR number + run attempt), for two properties:
      #
      #   - Deterministic per PR per attempt, so every job in a run agrees on
      #     the account and one review is never split across two sessions.
      #   - A RE-RUN LANDS ON THE OTHER ACCOUNT. That is the point. The advice
      #     attached to a timeout is "re-runs often pass", and re-running
      #     against the account that just failed to answer is the weakest
      #     version of that. Incrementing on run_attempt makes a retry a real
      #     retry rather than the same request again.
      #
      # Degrades to one account: with JULES_API_KEY_2 unset this always picks
      # primary, so the file is unchanged in behaviour for an org with one key.
      - name: Choose a Jules account
        id: jules_account
        # Explicit, not inherited. The script uses `set -o pipefail` and shell
        # arithmetic; the default shell is bash on these runners today, but a
        # step that only works because of a default is a step that breaks when
        # the default moves.
        shell: bash
        env:
          # Comparing to '' proves the secret EXISTS without reading it; only a
          # boolean reaches the script.
          HAVE_SECOND: ${{ secrets.JULES_API_KEY_2 != '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$HAVE_SECOND" != "true" ]; then
            echo "use=primary" >> "$GITHUB_OUTPUT"
            echo "one Jules key configured; using it"
            exit 0
          fi
          # Both values come from GitHub and are integers, but they are read
          # from the environment rather than interpolated into this script: a
          # run block is not where you want to discover an expression was not
          # what you assumed.
          # Each value checked SEPARATELY. Concatenating them hid the case
          # that actually occurs: on a non-pull_request event PR_NUMBER is
          # empty, so "$PR_NUMBER$RUN_ATTEMPT" is just "1" -- numeric, guard
          # passes, and the arithmetic below then runs with a missing operand.
          for v in "$PR_NUMBER" "$RUN_ATTEMPT"; do
            case "$v" in
              *[!0-9]*|"")
                echo "use=primary" >> "$GITHUB_OUTPUT"
                echo "no usable index (pr='$PR_NUMBER' attempt='$RUN_ATTEMPT'); using primary"
                exit 0 ;;
            esac
          done
          if [ $(( (PR_NUMBER + RUN_ATTEMPT) % 2 )) -eq 0 ]; then
            use=primary
          else
            use=secondary
          fi
          echo "use=$use" >> "$GITHUB_OUTPUT"
          echo "PR $PR_NUMBER attempt $RUN_ATTEMPT -> $use"

      - name: Run maxi-reviewer
        # ~37% of invocations used to hang with no step output and hold a scarce
        # self-hosted runner until the job timeout (maxi-reviewer#53).
        #
        # 40, derived — do not tune it on its own. The action enforces a hard
        # deadline in-process at `hard_timeout_minutes`, defaulting to
        # `timeout_minutes + 20`, and maxi-reviewer's README requires this step
        # bound to sit ABOVE that plus a few minutes of cleanup headroom.
        # 15 + 20 = 35, + 5 = 40 — the same five-minute margin the documented
        # 30-minute default gets (50, step 55). A bound AT 35 fires at the same
        # instant as the in-process deadline and can kill a review still
        # legitimately inside it, defeating the graceful status cleanup this
        # exists to preserve. A blocked Node event loop can stop the in-process
        # timers firing, which is why this outer bound is the real
        # runner-release watchdog.
        #
        # That arithmetic first became true of the FLEET at pin f772893, and it
        # still holds at the pin below: both carry src/hard-deadline.ts and the
        # `hard_timeout_minutes` input, checked against each revision before
        # moving the pin, so advancing it changes nothing about the timeout
        # regime. The pin BEFORE f772893, ae2700a, predated
        # src/hard-deadline.ts entirely — no `hard_timeout_minutes` input, no
        # deadline timer in its dist — so this bound was the only thing
        # releasing the runner, and it had to cover setup plus the whole poll
        # rather than merely outlive a timer at 35. 40 was chosen to be correct
        # under both regimes precisely so the pin could move without this
        # number moving with it. Whenever `timeout_minutes` moves, this does:
        # timeout_minutes + 25.
        timeout-minutes: 40
        uses: maxi-tools/maxi-reviewer@1c5e1d8dece75f724cc95a35c0908579ca6d8d80
        with:
          # Which account, chosen by the step above. The KEY itself is read
          # straight from `secrets` here rather than passed through a step
          # output, so the value never becomes an output that could be printed.
          jules_api_key: ${{ steps.jules_account.outputs.use == 'secondary' && secrets.JULES_API_KEY_2 || secrets.JULES_API_KEY }}
          # The OTHER account -- the inverse of the line above -- used only
          # when a session never leaves repository setup. The reviewer
          # recreates it there rather than waiting out a budget that cannot
          # produce a review; see maxi-reviewer#100.
          #
          # Degrades to a same-account recreate in BOTH directions, which is
          # still the cheapest thing that recovers a clone that never finished:
          #
          #  - JULES_API_KEY_2 unset: this renders empty, and the reviewer
          #    reads an empty fallback as "no second account".
          #  - JULES_API_KEY unset while the selection picked secondary: a
          #    GitHub `A && B || C` yields C whenever B is falsy, so this
          #    renders as JULES_API_KEY_2 -- the key already in use. There is
          #    no expression that preserves an empty string here instead;
          #    adding a second condition renders the literal "false", which is
          #    worse. The reviewer covers it: `planAttempts` takes the
          #    fallback only when it is non-empty AND differs from the active
          #    key, so an identical one plans a fresh session on the same
          #    account rather than a pointless switch to itself.
          #
          # Read straight from `secrets` for the same reason as the primary:
          # the value never becomes a step output that could be printed.
          jules_api_key_fallback: ${{ steps.jules_account.outputs.use == 'secondary' && secrets.JULES_API_KEY || secrets.JULES_API_KEY_2 }}
          # Jules stays primary. A no-review timeout hands the same prompt to
          # the private DGX vLLM endpoint. Keep any bearer token in Actions
          # secrets; this HTTP-only vLLM deployment uses no API key, so leave
          # the Actions secret unset until HTTPS is available. Never send a
          # bearer key over this plaintext endpoint.
          openai_base_url: http://pearl:8000/v1
          openai_model: Qwen3-Coder-Next
          openai_api_key: ${{ secrets.MAXI_REVIEW_OPENAI_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          rules_file: ""
          # Bounded by construction, not by hope: one rule file per language
          # the PR touches (select-rules.sh over the pinned jules-rules
          # directory), and the churn note, which detect-review-churn.py emits
          # from integers alone. Neither grows with the size of the diff, which
          # is the property this input needs now that the findings Markdown
          # does not travel here (maxi-config#1025).
          extra_instructions: |
            ${{ steps.rules.outputs.text }}
            ${{ steps.churn.outputs.text }}
          # 15 — twice measured, from both directions.
          #
          # Down from 30: MEASURED on maxi-nix, the last seven completed runs
          # under the 30-minute budget were 30.7, 30.8, 30.8, 41.1, 50.3, 50.3
          # and 59.0 minutes -- and THREE OF THE SEVEN produced no verdict at
          # all. Those three are the 30-minute cluster: they spent the whole
          # budget and returned nothing, then set `advisory: maxi reviewer`
          # red for having failed to work. On a gate every push to every PR in
          # ~90 repos waits for, that is half an hour of dead wall-clock per
          # bad run.
          #
          # Back up from 10: the premise behind 10 was "a review that has
          # produced no agent message in ten minutes is not about to". MEASURED
          # 2026-08-30, that is false. `pollForReview` in maxi-reviewer's
          # src/jules.ts sleeps 20s between attempts, so 10 minutes is ~30
          # attempts -- and two real reviews landed that day on attempt 26
          # (~8.7 min) and attempt 29 (~9.7 min), inside the budget by seconds.
          # maxi-reviewer's own action.yml warns that non-trivial PRs often
          # take 15-25 minutes. 15 keeps half the saving over 30 while putting
          # the observed successes comfortably inside the budget instead of on
          # the cliff edge.
          #
          # NOT per-repository: that theory came from bootstrap and maxi-kvm
          # being absent from Jules' connected Codebases list, and one run
          # killed it -- bootstrap#68, still absent, came back `verdict:
          # approve`. One observation rules the theory out without explaining
          # the variance. Response latency looks independent of anything we
          # send, which leaves this number as the only lever we control.
          #
          # Changing this number changes `timeout-minutes` on this step: the
          # in-process hard deadline is timeout_minutes + 20 and the step bound
          # must clear it by ~5 minutes of cleanup headroom.
          timeout_minutes: "15"
          # NEVER, and the context name is the short version of why: a status
          # called `advisory:` that fails the check is not advisory. These two
          # lines sat adjacent and contradicting for as long as they have both
          # existed, and unlike every other input in this block, neither
          # carried a reason.
          #
          # Three things this lane reports are not verdicts on the code:
          #
          #   1. Its own timeouts. The comment above measures three runs in
          #      seven that spent the whole budget and returned nothing, then
          #      "set `advisory: maxi reviewer` red for having failed to work".
          #      Reviewer infrastructure failing is not a finding.
          #   2. Blocking verdicts its own rules forbid. maxi-reviewer's
          #      src/prompt.ts already says that for claims about third-party
          #      tools and APIs, "if you are relying only on memory of an
          #      external API, mention the uncertainty and do not use `block`".
          #      Observed 2026-09-09 on maxi-kvm#85: High severity, High
          #      confidence, verdict `block`, asserting that
          #      actions/create-github-app-token requires `app-id` and rejects
          #      `client-id`. Upstream documents the opposite -- `client-id` is
          #      recommended and `app-id` is the legacy input -- so applying
          #      that finding would have broken the token step it claimed to
          #      repair. The rule is right; nothing enforces it.
          #   3. Verdicts about a diff it did not read. The same run recorded
          #      the new head SHA against a review of superseded content.
          #
          # Nothing is lost by going advisory in fact as well as in name. The
          # findings still publish as PR review comments, and `maxi-reviewer[bot]`
          # still counts for `review-gate/non-author-review`, which reads
          # reviews rather than statuses. What goes away is a red check that
          # ~90 repositories' pull requests wait on, which is red for reasons
          # its own precision does not support.
          #
          # The condition for returning this to "blocking" is a measurement,
          # not a feeling: maxi-reviewer/src/calibration.ts already aggregates
          # per-rule precision from harvested artifacts. Point it at the block
          # verdicts and raise this again when that number justifies a gate.
          fail_on: "never"
          status_context: 'advisory: maxi reviewer'
          # The findings arrive as a FILE, and this is the input that reads it.
          # maxi-reviewer opens `opengrep_sarif` with readFileSync and puts
          # nothing in an environment variable or an argument, so a findings
          # set larger than ARG_MAX is not a failure here -- it is the case
          # this lane exists to survive (maxi-config#1025, waterui#180).
          #
          # SARIF rather than the raw findings JSON because maxi-lint emits no
          # severity field and no location object. maxi-lint-to-sarif.py maps
          # the deny/warn/unknown split the gate already computes onto SARIF
          # `level`, so the reviewer reads the same grades the gate applied
          # rather than re-deriving them.
          #
          # It also lands the findings inside the prompt's nonce-fenced
          # UNTRUSTED block. In `extra_instructions` they sat in the
          # "authoritative -- apply all of them" project-rules section, which is
          # deliberately unfenced: a print-hygiene message quotes the print
          # statement that triggered it, so PR-authored text was reaching the
          # model as instruction (maxi-config#163).
          opengrep_sarif: .maxi-lint-findings/maxi-lint-findings.sarif
          # `auto`, not `off`, and NOT because the analyzers should run.
          # runAnalyzers returns as soon as a configured output file yields
          # findings or any analyzer path is set at all
          # (hasConfiguredAnalyzerOutput), so the external `opengrep` and `pmd`
          # spawns below that early return are unreachable on this lane. `off`
          # would return [] before reading the file and silently drop every
          # finding -- a review with no scan, which is the one outcome
          # maxi-config#163 exists to prevent. tests/test_maxi_review_workflow.py
          # pins that this is not `off`.
          analyzer_mode: "auto"
          # Explicit, and empty. maxi-reviewer's action.yml defaults
          # `bypass_label` to "maxi-review-override", so leaving this unset does
          # NOT mean "no bypass" -- it means a bypass this repository never
          # spells anywhere, which is why `grep maxi-review-override` finds
          # nothing in any of the ~31 repos this file lands in.
          #
          # Measured on maxi-config#536 (issue #555). With the label applied,
          # `Run maxi-reviewer` logged one line -- `Bypass label
          # "maxi-review-override" present - skipping review.` -- returned in
          # ~0.1s, published NO `advisory: maxi reviewer` status at all, and
          # concluded `success` under this job's `continue-on-error: true`. An
          # invisible skip, not a red one: on the PR page it is indistinguishable
          # from a lane that has not reported yet.
          #
          # And it skipped the wrong half of the system. `maxi-reviewer[bot]` is
          # one of the non-author reviewers that satisfies
          # `review-gate/non-author-review`, and the gate reads reviews, never
          # labels -- so the documented escape hatch ("Bypass Maxi Review when
          # review infrastructure is unavailable") removed a reviewer while
          # leaving intact the requirement that a reviewer exist. A PR carrying
          # it was STRICTLY LESS mergeable, in exactly the situation the label
          # was built for.
          #
          # The capability is not deleted, it moved to the half that is
          # load-bearing: `review-infra-unavailable` is honoured by
          # .github/actions/pr-review-gate. Suppressing the reviewer never
          # helped anyway -- a reviewer that RUNS and fails publishes `advisory:
          # maxi reviewer` red, which is the evidence that the infrastructure is
          # down; skipping it destroys that evidence.
          #
          # An explicitly supplied empty string overrides an action.yml default:
          # `rules_file: ""` three lines up already relies on that, and
          # maxi-reviewer's action.yml documents it ("Set to empty string to
          # disable"). No label is named "", so no label bypasses.
          # tests/ci_economy_assets.rs pins this line in BOTH copies, because
          # deleting it does not fail anything at runtime -- it silently
          # reinstates the default.
          bypass_label: ""
