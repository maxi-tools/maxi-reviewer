# maxi-config-owned Maxi PR review workflow.
#
# Drop this into a repo's .github/workflows/. It:
#   1. runs deterministic maxi-lint on changed files in lint-gate,
#   2. selects per-language Jules rules from central maxi-config,
#   3. feeds both the ruleset and lint findings to maxi-reviewer.
#
# The deterministic lint and AI review failure modes intentionally stay separate:
# lint-gate can be required as a fast merge gate, while review remains an
# advisory/commenting lane unless a repo explicitly requires its context.
name: Maxi Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: maxi-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-gate:
    # Same-repository only: this job uses org app credentials to install the
    # private maxi-lint scanner. It checks changed files only and fails solely
    # on deny-level deterministic findings.
    #
    # NOT maxi-config's own fan-out. Every branch the distributor pushes is
    # named maxi-config-sync/<manifest> (scripts/sync-maxi-review.sh), and what
    # it carries is a byte-for-byte copy of a payload already reviewed on the
    # maxi-config PR that changed it -- including this very file. The fan-out
    # reaches ~31 repos, so without this the org re-derives one verdict
    # thirty-one times per change, on the same self-hosted lane the repos' real
    # CI is queued on.
    #
    # `github.head_ref` and not `github.event.pull_request.head.ref`: they
    # agree on pull_request events, and head_ref is the spelling every other
    # branch guard in this fleet already uses (`startsWith(github.head_ref,
    # 'salvage/') == false`), so a reader recognises the shape.
    #
    # THE AUTHOR IS CHECKED TOO, and the condition is the De Morgan of "skip
    # when it is the fan-out": run unless the branch prefix AND the identity
    # both say fan-out. A head ref is chosen by whoever pushes the branch, so
    # the prefix alone would let anyone opt out of the org's review lanes by
    # naming a branch. This matches pr_review_gate.py, which gates its bypass
    # on the same pair -- and the two must not disagree, or the gate and the
    # reviewers it counts would classify the same PR differently.
    #
    # Spelled `maxi-tools-auth[bot]` WITH the suffix, unlike the Python gate's
    # bare slug. `github.event.*` is the raw webhook payload, i.e. REST shape,
    # and REST spells a Bot actor with the suffix -- confirmed on a live
    # fan-out PR (maxi-kvm#24: `user.login = "maxi-tools-auth[bot]"`, `type =
    # "Bot"`), where the same actor reads as `maxi-tools-auth` over GraphQL.
    # The two literals differ because the two APIs differ, not by accident.
    #
    # NOR A DEPENDABOT RUN, for a different reason: it cannot work at all.
    # `secrets.APP_ID` / `APP_PRIVATE_KEY` are ordinary Actions secrets, and a
    # Dependabot-triggered run gets the DEPENDABOT secrets scope instead --
    # which this org has never populated. So both arrive as empty strings and
    # the app-token step below dies with `The 'client-id' (or deprecated
    # 'app-id') input must be set to a non-empty string`, ~5s in, having
    # scanned nothing. That is maxi-kvm#4-#7 exactly. A job that cannot reach
    # its scanner should SKIP and say so, not report the PR broken.
    #
    # Keyed on `github.actor`, not on the PR author, because the actor is what
    # GitHub keys the secrets restriction on: when a human pushes to a
    # dependabot/* branch the actor becomes that human, ordinary secrets ARE
    # available, and this lane should run normally. maxi-core's ci.yml keys its
    # eleven dependabot guards the same way, for the same reason.
    #
    # The review gate's non-author-review leg is what makes this safe to skip
    # rather than merely quiet: pr_review_gate.py waives THAT CONDITION ONLY on
    # a dependabot/* PR, because these two jobs are the only non-author
    # reviewers such a PR ever gets and no push can summon them -- the next
    # push is Dependabot's too. It does NOT waive the unresolved-threads
    # condition, which stays measurable via the human-push case above.
    #
    # This exclusion is only half of the change. `review-gate`'s
    # non-author-review leg counts DISTINCT NON-AUTHOR reviewers, and on a
    # fan-out PR those reviewers were maxi-reviewer and CodeRabbit -- exactly
    # what is being suppressed. maxi-config's pr_review_gate.py therefore
    # bypasses the same branch prefix, and MUST be deployed first, or every
    # fan-out PR is gate-red with no push that can fix it.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (
        startsWith(github.head_ref, 'maxi-config-sync/') == false ||
        github.event.pull_request.user.login != 'maxi-tools-auth[bot]'
      ) &&
      (
        vars.CI_ENFORCEMENT_MODE == 'strict' ||
        contains(github.event.pull_request.labels.*.name, 'run-maxi-review')
      )
    # Was ubuntu-latest. With the org's Actions allowance exhausted, hosted
    # jobs are rejected before a runner is assigned -- zero steps, no log, ~3s
    # to "failure" -- so this gate reported every PR broken without scanning a
    # single line. Same-repository PRs only (the `if` above), so this is org
    # code on the org's own fleet, not fork code.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    # Primary handoff channel to `review`. The artifact below is the backup, and
    # the only carrier of the human-facing .md -- but artifact storage is a
    # SHARED org-wide quota, so an unrelated repo's images can make every upload
    # in the org fail, and with it every download. A job output travels with the
    # run itself and depends on no storage at all, so the findings reach `review`
    # whether or not artifact storage happens to be available today.
    outputs:
      findings-json: ${{ steps.findings-output.outputs.json }}
    steps:
      - name: Create Maxi Review app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAXI_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAXI_REVIEW_APP_PRIVATE_KEY }}
          owner: maxi-tools
          repositories: |
            maxi-config
            maxi-libs
            maxi-lint
            ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read

      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-code
          persist-credentials: false

      - name: Fetch maxi-review helper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: maxi-tools/maxi-config
          path: .maxi-config
          sparse-checkout: maxi-review
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      # Refuses a PR that edits a file the distributor overwrites. Deterministic,
      # so it belongs in this job rather than the AI lane -- and this job is the
      # one repos can require as a merge gate.
      #
      # The file list comes from the API, not `git diff`: the PR head above is
      # checked out at depth 1, so the base commit is absent and a diff would
      # fail. Widening the clone for every repo on every PR is a real cost for
      # a list the API already holds.
      #
      # --paginate matters. Without it a PR over 100 files is judged on its
      # first page and the gate passes on files it never saw -- silently, which
      # is the exact failure mode it exists to catch.
      - name: Refuse edits to centrally-owned files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: bash
        working-directory: pr-code
        run: |
          set -euo pipefail
          # The .maxi-config checkout above takes maxi-config's DEFAULT branch,
          # so this helper is whatever main holds right now -- deliberately, as
          # a pinned ref would freeze a centrally-owned check in 46 repos. The
          # cost is that a rollback of maxi-config main removes it under us, and
          # `python3 <missing>` fails with a bare ENOENT and no hint of why.
          helper="$GITHUB_WORKSPACE/.maxi-config/maxi-review/check-owned-files.py"
          if [ ! -f "$helper" ]; then
            echo "::error::$helper is missing from maxi-config's default" \
              "branch. This gate fails closed rather than passing a PR it" \
              "never checked; restore the helper on maxi-config main."
            exit 1
          fi
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
          # --labels=VALUE, not --labels VALUE: a label beginning with '-' is
          # parsed as an option in the separated form and argparse exits 2.
          python3 "$helper" \
            --files="$RUNNER_TEMP/changed-files.txt" \
            --labels="$PR_LABELS"

      - name: Run maxi-lint deny gate
        id: maxilint
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          # Step-scoped git config instead of `git config --global`, so the
          # token never lands in a runner's persistent ~/.gitconfig where it
          # would outlive the run and break later anonymous fetches
          # (maxi-config#221). Scoped to maxi-tools so public deps still
          # resolve without a token; the trap removes it even on early exit.
          gitcfg="${RUNNER_TEMP:-$HOME}/gitconfig-maxi-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Caller-owned install root: the installer sweeps only its own source
          # checkout, so the executable must live somewhere that survives that
          # trap. Cleaned here on EXIT — the one and only deletion of this path.
          lint_install_root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/maxi-lint-install.XXXXXX")"
          trap 'rm -f "$gitcfg"; rm -rf "$lint_install_root"' EXIT
          umask 077
          cat > "$gitcfg" <<GITEOF
          [url "https://x-access-token:${GH_TOKEN}@github.com/maxi-tools/"]
            insteadOf = https://github.com/maxi-tools/
          GITEOF
          export GIT_CONFIG_GLOBAL="$gitcfg"
          # Pinned, unconditional install from the .maxi-config checkout —
          # NEVER from pr-code. A pull request must not supply the script that
          # installs the linter grading it; that is the same rule the review
          # job states below ("a PR must not be able to influence its own
          # review"), applied to the judge rather than the policy.
          #
          # Unconditional on purpose: an "only if absent" guard lets a runner
          # inherit maxi-lint from an earlier job, which is how verdicts stopped
          # being reproducible in the first place (maxi-core#3165).
          #
          # RULES is an explicit allowlist. The installer fails closed, naming
          # names, if the pinned maxi-lint does not carry every rule listed —
          # a stale binary otherwise drops unknown rules and still exits 0.
          RULES="serialization,ansi,yaml,queue,async,jsonl,reqwest-ssrf,audit,injection,backup-files,database,mcp-envelope,unwrap,timeout-fence,print-hygiene,hidden-spawn"
          sh .maxi-config/maxi-review/test_install_maxi_lint.sh
          CARGO_NET_GIT_FETCH_WITH_CLI=true \
            sh .maxi-config/maxi-review/install_maxi_lint.sh 61205f17cdf0fbd95b75d641ca38a24df9548102 "$RULES" "$lint_install_root"
          # Bind the executable explicitly. Resolving `maxi-lint` through PATH
          # would let a pre-existing binary shadow the pinned one — the workflow
          # prepends /opt/homebrew/bin ahead of Cargo's install dir, so the pin
          # would verify and scan with a binary we never installed.
          lint_bin="$lint_install_root/bin/maxi-lint"
          if [ ! -x "$lint_bin" ]; then
            echo "::error::installed maxi-lint unavailable; failing lint gate rather than passing without a scan (maxi-config#163)"
            exit 1
          fi

          to=""
          if command -v timeout >/dev/null 2>&1; then to="timeout 120"
          elif command -v gtimeout >/dev/null 2>&1; then to="gtimeout 120"; fi
          # A crashed/timed-out/empty scan must fail the gate, not fold to [].
          # A non-zero exit with valid JSON output still counts as a completed
          # scan (the deny-level fold below decides pass/fail).
          lint_status=0
          findings=$($to "$lint_bin" --format json pr-code) || lint_status=$?
          if [ -z "$findings" ] || ! printf '%s\n' "$findings" | jq -e 'type == "array"' >/dev/null; then
            echo "::error::maxi-lint produced no valid JSON findings (exit=$lint_status); failing lint gate (maxi-config#163)"
            exit 1
          fi
          printf '%s\n' "$findings" > all-findings.json
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" > pull-files-pages.json
          jq -s 'add | map(select(.status != "removed"))' pull-files-pages.json > pull-files.json
          python3 .maxi-config/maxi-review/filter-maxi-lint-findings.py \
            all-findings.json pull-files.json > filtered-findings.md
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | select(.status != "removed") | .filename' > changed-files.txt
          python3 - all-findings.json changed-files.txt filtered-findings.md maxi-lint-findings.json maxi-lint-findings.md <<'PY'
          import json, sys

          raw = json.load(open(sys.argv[1]))
          changed = {line.strip() for line in open(sys.argv[2]) if line.strip()}
          markdown = open(sys.argv[3]).read()

          def path_of(finding):
              return (
                  finding.get("path")
                  or finding.get("file")
                  or finding.get("filename")
                  or ""
              ).removeprefix("pr-code/")

          def level_of(finding):
              return str(
                  finding.get("level")
                  or finding.get("severity")
                  or finding.get("decision")
                  or finding.get("kind")
                  or ""
              ).lower()

          scoped = []
          deny = []
          for finding in raw:
              path = path_of(finding)
              if path and path not in changed:
                  continue
              scoped.append(finding)
              if level_of(finding) in {"deny", "error", "blocking", "fail"}:
                  deny.append(finding)

          json.dump(scoped, open(sys.argv[4], "w"), indent=2)
          with open(sys.argv[5], "w") as out:
              if markdown.strip():
                  out.write("## maxi-lint findings\n\n")
                  out.write("Deterministic findings on files changed by this PR.\n\n")
                  out.write(markdown)
                  if not markdown.endswith("\n"):
                      out.write("\n")

          if deny:
              print(f"maxi-lint found {len(deny)} deny-level finding(s)")
              sys.exit(1)
          PY

      # Deliberately a SEPARATE step from the deny gate above, and deliberately
      # always(): the gate decides the verdict by its own exit status, and
      # `review` runs with always() and still needs the findings when that
      # verdict is a failure. Splitting them means publishing cannot change the
      # verdict, and the verdict cannot suppress the handoff.
      - name: Publish maxi-lint findings as a job output
        id: findings-output
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s maxi-lint-findings.json ]; then
            echo "no maxi-lint findings file on disk; nothing to publish as a job output"
            exit 0
          fi
          # Job outputs are capped at 1 MB across the whole job. Stop well short
          # of it. Past this threshold, omit the output ENTIRELY rather than ship
          # a truncated array: a clipped JSON list still parses, as a shorter
          # findings list, and would read as a cleaner PR than it is. Omitting is
          # visible -- `review` falls back to the artifact, and fails loudly if
          # that is missing too -- where truncation would be silent.
          max_bytes=524288
          size="$(wc -c < maxi-lint-findings.json | tr -d '[:space:]')"
          if [ "$size" -gt "$max_bytes" ]; then
            echo "::warning::maxi-lint findings are ${size} bytes, over the ${max_bytes}-byte job-output threshold; omitting the job output -- the uploaded artifact is the only findings channel for this run"
            exit 0
          fi
          # Unique per run. The heredoc body is scanner output quoting the code
          # under review, so a fixed delimiter appearing inside a finding would
          # close the block early and let the remaining findings be parsed as
          # further step outputs.
          delim="MAXI_LINT_JSON_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          {
            echo "json<<${delim}"
            cat maxi-lint-findings.json
            # json.dump leaves no trailing newline; without this the closing
            # delimiter would land on the last line of JSON and never match.
            echo ""
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"
          echo "published ${size} bytes of maxi-lint findings as a job output"

      - name: Upload maxi-lint findings
        if: ${{ always() }}
        # Scoped to THIS step and never to the job: the deny gate above must
        # still fail the job on deny-level findings. By the time this runs the
        # verdict is already decided and this step only moves the result around.
        # Whether the org's shared artifact storage has room today is not a
        # property of the code under review, so a storage failure must not turn a
        # clean lint into a red check -- which is exactly what it did while the
        # quota was exhausted. The upload still runs: humans download it, and it
        # carries the .md that a job output cannot. `review` falls back to the
        # job output when this is missing, and fails loudly when BOTH channels
        # come up empty.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maxi-lint-findings
          # Consumed by the `review` job in this same run and never needed
          # afterwards, but it inherited the 90-day default retention, so every
          # PR run left a copy behind. 73 had accumulated. Combined with much
          # larger images elsewhere in the org this exhausted the shared
          # artifact storage quota, which fails this gate -- and every other
          # artifact upload org-wide -- with "Artifact storage quota has been
          # hit". A same-run handoff does not need to outlive the run.
          retention-days: 1
          path: |
            maxi-lint-findings.json
            maxi-lint-findings.md
          if-no-files-found: error

  review:
    needs: lint-gate
    # Same fan-out exclusion as lint-gate, restated rather than inherited:
    # `always()` here means a SKIPPED lint-gate does not skip this job, so
    # excluding only lint-gate would leave the AI reviewer -- the expensive
    # half -- running on all ~31 copies anyway.
    if: >
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (
        startsWith(github.head_ref, 'maxi-config-sync/') == false ||
        github.event.pull_request.user.login != 'maxi-tools-auth[bot]'
      ) &&
      (
        vars.CI_ENFORCEMENT_MODE == 'strict' ||
        contains(github.event.pull_request.labels.*.name, 'run-maxi-review')
      )
    continue-on-error: true
    # Was ubuntu-latest. With the org's Actions allowance exhausted, hosted
    # jobs are rejected before a runner is assigned -- zero steps, no log, ~3s
    # to "failure" -- so this gate reported every PR broken without scanning a
    # single line. Same-repository PRs only (the `if` above), so this is org
    # code on the org's own fleet, not fork code.
    runs-on: [self-hosted, Linux, X64]
    # Must exceed the reviewer step's 40, or the job cap fires first and the
    # step bound — the actual runner-release watchdog — can never take effect.
    # README: "use a step timeout-minutes of at least [hard deadline + cleanup
    # headroom] and a job timeout above that."
    #
    # 70 because this cap covers the WHOLE job, and everything ahead of the
    # reviewer step here is network-bound: two app-token mints, the maxi-lint
    # findings artifact download, the rules fetch, the per-language rule
    # selection, the PR-head checkout, and the built-in rules fetch and
    # staging. (The pinned maxi-lint cargo install is NOT in this job — it runs
    # in lint-gate, under its own 10-minute cap.) A job cancellation kills the
    # action mid-run, skipping exactly the graceful status cleanup the step
    # bound exists to preserve, so this cap must never be the one that fires.
    # 70 leaves 30 minutes of setup headroom above the 40-minute step bound,
    # and bounds the job far below GitHub's 6-hour default, which is what would
    # otherwise hold the runner if both inner bounds failed to fire.
    timeout-minutes: 70
    permissions:
      pull-requests: write
      issues: write
      contents: read
      statuses: write
    steps:
      - name: Create Maxi Review app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAXI_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAXI_REVIEW_APP_PRIVATE_KEY }}
          owner: maxi-tools
          repositories: |
            maxi-config
            ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Download maxi-lint findings
        # Scoped to THIS step. The artifact is the backup channel and the only
        # carrier of the human-facing .md; when the org's shared artifact storage
        # is unavailable there is nothing to download, and that says nothing
        # about the PR. The next step materialises the JSON from lint-gate's job
        # output instead, and FAILS if neither channel produced findings -- so
        # tolerating the missing download here never lets a review proceed
        # unscanned, it only stops storage outages from being reported as one.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maxi-lint-findings
          path: .maxi-lint-findings

      - name: Materialise maxi-lint findings
        env:
          # Via env, not inline `${{ }}` in the script: the value is scanner
          # output quoting the PR's own code and must reach the shell as data.
          LINT_FINDINGS_JSON: ${{ needs.lint-gate.outputs.findings-json }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .maxi-lint-findings
          json=.maxi-lint-findings/maxi-lint-findings.json
          if [ -s "$json" ]; then
            echo "maxi-lint findings JSON came from the artifact"
          elif [ -n "${LINT_FINDINGS_JSON:-}" ]; then
            printf '%s\n' "$LINT_FINDINGS_JSON" > "$json"
            echo "artifact unavailable; materialised maxi-lint findings JSON from the lint-gate job output"
          fi
          # An empty findings array is a legitimate clean scan. NO findings from
          # either channel is not -- it is an unknown, and reviewing without the
          # deterministic scan would report a green review the scan never backed.
          # Same stance the lint gate takes when its binary is missing: fail
          # rather than pass without a scan (maxi-config#163).
          if [ ! -s "$json" ] || ! python3 -c 'import json,sys; sys.exit(0 if isinstance(json.load(open(sys.argv[1])), list) else 1)' "$json"; then
            echo "::error::no maxi-lint findings from either channel (artifact download and lint-gate job output both empty or invalid); failing review rather than reviewing without a scan (maxi-config#163)"
            exit 1
          fi
          # The .md is human-facing prose built from the same findings; the
          # reviewer prompt below simply omits it. Losing it degrades the write-up,
          # not the scan, so it is worth a log line and not a failure.
          if [ ! -s .maxi-lint-findings/maxi-lint-findings.md ]; then
            echo "maxi-lint findings markdown is unavailable (human-facing only); proceeding on the JSON alone"
          fi

      - name: Fetch maxi-review rules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: maxi-tools/maxi-config
          path: .maxi-config
          sparse-checkout: maxi-review
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Select per-language rules from changed files
        id: rules
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          files=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | select(.status != "removed") | .filename')
          rules=$(printf '%s\n' "$files" | \
            bash .maxi-config/maxi-review/select-rules.sh .maxi-config/maxi-review/jules-rules)
          {
            echo "text<<JULES_RULES_EOF"
            echo "$rules"
            echo "JULES_RULES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Looks ACROSS review rounds, which no single review can do. A
      # line-level reviewer is very good at "this line is wrong" and
      # structurally unable to say "this approach guarantees more of these" --
      # every finding is correct, every fix is correct, and the next round
      # produces another of the same shape. Emits nothing on a converging PR,
      # which is almost all of them.
      - name: Detect review churn
        id: churn
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          # PIPED, not passed as an argument. One real PR's comment payload
          # measured 910 KB against a 1 MB ARG_MAX on these runners, and the
          # PRs this step targets are the ones with the most comments -- so
          # argv would have failed to exec exactly where it is needed.
          #
          # `|| true` and the empty default below: this step may only ever ADD a
          # question to the review. A rate-limited call or a parse failure must
          # leave the review exactly as it would have been and never fail the
          # job -- the review is the product, this is a footnote on it.
          text=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" 2>/dev/null \
            | python3 .maxi-config/maxi-review/detect-review-churn.py 2>/dev/null \
            || true)
          # A RANDOM DELIMITER, because `$text` is PR comment bodies -- data an
          # attacker controls. With a fixed `CHURN_EOF`, a comment containing
          # that word on a line of its own closes the heredoc early, and every
          # line after it is parsed as a fresh `$GITHUB_OUTPUT` assignment:
          # arbitrary step outputs, set by anyone who can comment on a PR.
          # GitHub's own guidance for untrusted multiline output is a delimiter
          # the writer cannot predict. (maxi-reviewer, seen on the fan-out.)
          delim="CHURN_EOF_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          {
            printf '%s\n' "text<<$delim"
            printf '%s\n' "$text"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare lint findings context
        id: maxilint
        run: |
          # Random for the same reason as the churn block above. This one is
          # findings text produced from the PR's own source, so it is one
          # remove from attacker-controlled rather than two -- a lint message
          # can quote the code that triggered it.
          delim="MAXI_LINT_EOF_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          {
            printf '%s\n' "text<<$delim"
            if [ -s .maxi-lint-findings/maxi-lint-findings.md ]; then
              cat .maxi-lint-findings/maxi-lint-findings.md
            fi
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-code
          persist-credentials: false

      - name: Generate reviewer repo token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: reviewer-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: maxi-tools
          repositories: maxi-reviewer
          permission-contents: read

      - name: Fetch maxi-reviewer built-in rules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: maxi-tools/maxi-reviewer
          token: ${{ steps.reviewer-token.outputs.token }}
          # MUST match the `maxi-tools/maxi-reviewer@<sha>` pin below. These two
          # fetch the same repo: this one supplies the built-in rules, that one
          # runs the action that consumes them. Split them and the reviewer
          # grades with one revision's code against another revision's rules —
          # a mismatch nothing else in this workflow would surface.
          ref: f772893df470bf0749e32ba6e916fad1166d3d63
          path: .maxi-reviewer-rules
          sparse-checkout: rules
          persist-credentials: false

      - name: Stage maxi-reviewer built-in rules
        run: |
          rm -rf rules
          mkdir -p rules
          cp -R .maxi-reviewer-rules/rules/. rules/
          # Fail closed: never source review policy from the PR branch — a PR
          # must not be able to influence its own review (maxi-config#163).
          if [ ! -f rules/rust.md ]; then
            echo "::error::pinned maxi-reviewer ref is missing rules/rust.md; refusing to fall back to PR-branch rules"
            exit 1
          fi

      # Pinned to a verified ancestor of maxi-reviewer's main, not to its head —
      # the fleet should be graded by a build with dogfood evidence behind it.
      # Evaluating a newer head is a deliberate follow-up, not a drive-by bump
      # inside the PR whose job is to stop unreviewed drift.
      #
      # f772893 is maxi-reviewer#92's merge commit, and it is main's head as
      # this moves -- a deliberate exception to "ancestor, not head", argued
      # rather than assumed. Six commits touch src/ or action.yml since the
      # previous pin ae2700a (2026-08-19): the in-process hard deadline
      # (862f1aa), the empty-review failure and explicit review outcomes
      # (ebdb6b4), the pending-status heartbeat and its two follow-ups
      # (04aa040, a2729c5, b4f67fe), and the timeout message this pin exists to
      # ship (a80aec7). The other 92 are workflow syncs and dependabot bumps
      # that never reach the action.
      #
      # The dogfood evidence the old wording asked for did not exist before
      # now. maxi-reviewer's "Verify checked-in dist" gate had been red on
      # every PR since at least 2026-08-26: it installed with npm against a
      # pnpm lockfile, so ncc rebuilt ~27k lines of different module
      # bookkeeping and the diff never had anything to do with the change under
      # review. 9b7b57f, inside this range, fixes it. f772893 is the first
      # commit whose dist has actually been verified against its own source.
      #
      # Advancing this also activates `hard_timeout_minutes`, a new input
      # defaulting to timeout_minutes + 20 = 35. Nothing in this file moves for
      # it: the step bound below is already 40, picked so this pin could
      # advance without dragging the timeout arithmetic behind it.
      - name: Run maxi-reviewer
        # ~37% of invocations used to hang with no step output and hold a scarce
        # self-hosted runner until the job timeout (maxi-reviewer#53).
        #
        # 40, derived — do not tune it on its own. The action enforces a hard
        # deadline in-process at `hard_timeout_minutes`, defaulting to
        # `timeout_minutes + 20`, and maxi-reviewer's README requires this step
        # bound to sit ABOVE that plus a few minutes of cleanup headroom.
        # 15 + 20 = 35, + 5 = 40 — the same five-minute margin the documented
        # 30-minute default gets (50, step 55). A bound AT 35 fires at the same
        # instant as the in-process deadline and can kill a review still
        # legitimately inside it, defeating the graceful status cleanup this
        # exists to preserve. A blocked Node event loop can stop the in-process
        # timers firing, which is why this outer bound is the real
        # runner-release watchdog.
        #
        # That arithmetic only became true of the FLEET when the pin advanced
        # to f772893 above. The previous pin, ae2700a, predated
        # src/hard-deadline.ts entirely — no `hard_timeout_minutes` input, no
        # deadline timer in its dist — so this bound was the only thing
        # releasing the runner, and it had to cover setup plus the whole poll
        # rather than merely outlive a timer at 35. 40 was chosen to be correct
        # under both regimes precisely so the pin could move without this
        # number moving with it. Whenever `timeout_minutes` moves, this does:
        # timeout_minutes + 25.
        timeout-minutes: 40
        uses: maxi-tools/maxi-reviewer@f772893df470bf0749e32ba6e916fad1166d3d63
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          rules_file: ""
          extra_instructions: |
            ${{ steps.rules.outputs.text }}
            ${{ steps.churn.outputs.text }}

            ${{ steps.maxilint.outputs.text }}
          # 15 — twice measured, from both directions.
          #
          # Down from 30: MEASURED on maxi-nix, the last seven completed runs
          # under the 30-minute budget were 30.7, 30.8, 30.8, 41.1, 50.3, 50.3
          # and 59.0 minutes -- and THREE OF THE SEVEN produced no verdict at
          # all. Those three are the 30-minute cluster: they spent the whole
          # budget and returned nothing, then set `advisory: maxi reviewer`
          # red for having failed to work. On a gate every push to every PR in
          # ~90 repos waits for, that is half an hour of dead wall-clock per
          # bad run.
          #
          # Back up from 10: the premise behind 10 was "a review that has
          # produced no agent message in ten minutes is not about to". MEASURED
          # 2026-08-30, that is false. `pollForReview` in maxi-reviewer's
          # src/jules.ts sleeps 20s between attempts, so 10 minutes is ~30
          # attempts -- and two real reviews landed that day on attempt 26
          # (~8.7 min) and attempt 29 (~9.7 min), inside the budget by seconds.
          # maxi-reviewer's own action.yml warns that non-trivial PRs often
          # take 15-25 minutes. 15 keeps half the saving over 30 while putting
          # the observed successes comfortably inside the budget instead of on
          # the cliff edge.
          #
          # NOT per-repository: that theory came from bootstrap and maxi-kvm
          # being absent from Jules' connected Codebases list, and one run
          # killed it -- bootstrap#68, still absent, came back `verdict:
          # approve`. One observation rules the theory out without explaining
          # the variance. Response latency looks independent of anything we
          # send, which leaves this number as the only lever we control.
          #
          # Changing this number changes `timeout-minutes` on this step: the
          # in-process hard deadline is timeout_minutes + 20 and the step bound
          # must clear it by ~5 minutes of cleanup headroom.
          timeout_minutes: "15"
          fail_on: "blocking"
          status_context: 'advisory: maxi reviewer'
          analyzer_mode: "off"
