# maxi-config-owned Maxi review gate un-sticker.
# Source of truth: maxi-config/maxi-review/review-gate-unstick.yml
# Fanned out by scripts/sync-maxi-review.sh; edit it there, not here.
#
# Re-runs a Review Gate verdict that is red only because it has not been asked
# again since the last thread was resolved.
#
# WHY THIS EXISTS
#
# review-gate.yml explains the gap it accepts: resolving a conversation emits no
# `pull_request` or `pull_request_review` event, and `pull_request_review_thread`
# is a GitHub App webhook that is NOT a valid workflow trigger -- adding it made
# GitHub reject the whole file, which is why the gate once created zero jobs in
# every repo in the org. Its conclusion was that "a gate that occasionally needs
# a re-run beats one that never runs", and that the human re-runs it.
#
# That reasoning is sound and this file does not touch it. What it corrects is
# the estimate. On maxi-core on 2026-09-10, TEN of seventeen non-draft PRs with
# a red gate had ZERO unresolved threads: every one was waiting only to be asked
# again. The oldest had been waiting since 2026-08-06. "Occasionally" turned out
# to mean "most of them, indefinitely", because the person who resolves a thread
# gets no signal that anything further is required, and a red check that nobody
# believes is a check that stops being read.
#
# So the trigger stays exactly as review-gate.yml has it, and this asks again on
# a timer instead.
#
# WHY IT CANNOT LOOP
#
# Three conditions, all required, and every one of them stops being true once
# the gate is answered:
#
#   1. the PR has zero unresolved review threads;
#   2. the latest Review Gate run for the PR's CURRENT head failed;
#   3. the failure includes a threads job -- not `get-a-non-author-review`.
#
# (3) is what keeps this from spinning. A gate red for want of a review from
# someone other than the author is not stale, and re-running it would produce
# the same verdict every half hour forever. Only the thread verdict is
# re-askable, because only it can have changed without an event.
#
# `run_attempt` is capped as a backstop for anything the three conditions miss.
name: Review gate unstick

on:
  schedule:
    # Every 30 minutes. This is API calls only -- no checkout, no build -- so
    # the cost is a handful of REST requests against a PR list that is usually
    # short, and the latency it removes is measured in weeks.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  # Required by `gh run rerun`, and the only reason this workflow needs more
  # than read: it re-runs an existing workflow, it never dispatches a new one.
  actions: write

concurrency:
  group: review-gate-unstick
  # Not cancel-in-progress: two ticks overlapping is harmless, and cancelling a
  # tick halfway through leaves some PRs asked and others not.
  cancel-in-progress: false

jobs:
  unstick:
    # Deliberately hosted, not the self-hosted fleet: a janitor for the merge
    # queue must not queue behind the build pool it exists to unblock. Same
    # principle the orphan-sources and pin-drift guards use.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask stale Review Gate verdicts again
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Backstop only. The three conditions above should already prevent a
          # loop; this bounds the damage if one of them is ever wrong.
          MAX_ATTEMPTS: "6"
        run: |
          set -uo pipefail

          prs="$(gh pr list --repo "$REPO" --state open --limit 200 \
                   --json number,headRefOid,isDraft || true)"
          if [ -z "$prs" ]; then
            echo "could not list pull requests"
            exit 1
          fi

          count="$(echo "$prs" | jq 'length')"
          echo "examining $count open pull request(s)"
          rerun=0
          # A janitor that reports success after an API outage is worse than one
          # that fails: the stale statuses it exists to clear stay stale, and
          # nothing says so. Every per-PR call that can fail increments this,
          # and a non-zero count fails the run.
          errors=0

          while IFS=$'\t' read -r number head draft; do
            [ "$draft" = "true" ] && continue

            # (1) zero unresolved threads. Asking again cannot help a gate that
            # is correctly red.
            # EVERY page. `first:100` is not enough: a long-running PR here
            # passed 100 threads, and an unresolved one on page 2 would be
            # invisible to a single-page count -- so this would re-run a gate
            # that is correctly red, which is the one thing it must never do.
            # `--paginate` with a cursor is the whole fix.
            #
            # shellcheck disable=SC2016  # $owner/$name/$number/$cursor are
            # GraphQL variables bound by the -F flags below, not shell
            # expansions. They must reach the API literally.
            # The query's status is captured BEFORE the sum. `awk ... print t+0`
            # always prints a number, so folding the two together made a failed
            # query indistinguishable from a PR with no unresolved threads --
            # it printed 0, the emptiness guard never fired, and the janitor
            # would re-run a gate that is correctly red. That is the same
            # fail-open shape this whole workflow exists to clean up after,
            # reproduced inside it.
            if ! thread_pages="$(gh api graphql --paginate -f query='
              query($owner:String!, $name:String!, $number:Int!, $endCursor:String) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$number) {
                    reviewThreads(first:100, after:$endCursor) {
                      nodes { isResolved }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }' -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$number" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                     | select(.isResolved == false)] | length' 2>/dev/null)"; then
              echo "PR #$number: review-thread query failed"
              errors=$((errors + 1))
              continue
            fi
            unresolved="$(printf '%s\n' "$thread_pages" | awk '{t+=$1} END {print t+0}')"
            [ "$unresolved" = "0" ] || continue

            # (2) the latest verdict for THIS head failed. An older head's
            # verdict says nothing about the commit that is up for merge.
            # Sorted by startedAt, not createdAt and not databaseId. Neither
            # of those identifies the newest EVALUATION:
            #
            #   createdAt  does not move when a run is re-run, so an old run
            #              re-run five minutes ago still sorts as old.
            #   databaseId is kept across a re-run while `attempt` increments,
            #              so a freshly re-run older run has a LOWER id than an
            #              untouched newer one -- and sorting by id would
            #              inspect the wrong verdict and leave the stale
            #              threads failure in place.
            #
            # startedAt moves with each attempt, which is the thing being
            # ranked. databaseId breaks ties for two runs started in the same
            # second.
            # EVERY gate run for this SHA, via the paginated REST endpoint.
            #
            # `gh run list` caps its result no matter how it is filtered, and a
            # cap is a window by another name: this gate re-runs on every
            # review-comment event, so a busy PR accumulates gate runs at one
            # head quickly, and the newest evaluation can sit outside any fixed
            # limit. The janitor would then rank a truncated list, miss the
            # current verdict, and skip the PR -- silently, which is the
            # property this workflow exists to remove.
            #
            # This is the same enumeration review-gate-reusable.yml performs on
            # itself for its staleness check, deliberately: one way of asking
            # "every run for this commit", not two that can disagree.
            if ! runs_json="$(gh api --paginate \
                     "repos/$REPO/actions/workflows/review-gate.yml/runs?head_sha=$head&per_page=100" \
                     --jq '.workflow_runs[] | {databaseId: .id, conclusion, attempt: .run_attempt, startedAt: .run_started_at}' 2>/dev/null)"; then
              echo "PR #$number: could not list Review Gate runs"
              errors=$((errors + 1))
              continue
            fi
            # --paginate --jq streams one object per line; collect then rank.
            run="$(printf '%s' "$runs_json" \
                   | jq -s 'sort_by(.startedAt, .databaseId) | last' 2>/dev/null || echo "")"
            if [ -z "$run" ]; then
              echo "PR #$number: could not rank Review Gate runs"
              errors=$((errors + 1))
              continue
            fi
            # `null` here means the gate simply has not run for this head yet,
            # which is not an error and not something to re-ask.
            [ "$run" != "null" ] || continue

            conclusion="$(echo "$run" | jq -r '.conclusion // ""')"
            [ "$conclusion" = "failure" ] || continue

            attempt="$(echo "$run" | jq -r '.attempt // 1')"
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "PR #$number: gate at attempt $attempt, leaving it alone"
              continue
            fi

            # (3) the failure is a threads verdict. A gate red for want of a
            # non-author review is not stale, and re-asking it would spin.
            id="$(echo "$run" | jq -r '.databaseId')"
            # Same trap as above: a failed jobs lookup used to yield empty,
            # default to 0, and read as "not a threads failure" -- so an outage
            # silently declined to re-ask every stale gate while the run still
            # reported success.
            if ! jobs_json="$(gh api "repos/$REPO/actions/runs/$id/jobs" 2>/dev/null)"; then
              echo "PR #$number: could not read jobs for run $id"
              errors=$((errors + 1))
              continue
            fi
            failed_threads="$(printf '%s' "$jobs_json" | jq '[.jobs[]
              | select(.conclusion == "failure")
              | select(.name | test("thread"; "i"))] | length' 2>/dev/null || echo "")"
            if [ -z "$failed_threads" ]; then
              echo "PR #$number: could not classify the failing jobs for run $id"
              errors=$((errors + 1))
              continue
            fi
            [ "$failed_threads" != "0" ] || continue

            echo "PR #$number: threads resolved but gate never re-asked; re-running run $id"
            if gh run rerun "$id" --repo "$REPO" >/dev/null 2>&1; then
              rerun=$((rerun + 1))
            else
              # A re-run that did not happen leaves the verdict stale, which is
              # the condition this exists to remove. It counts.
              echo "PR #$number: re-run request failed"
              errors=$((errors + 1))
            fi
            # Tab-delimited via @tsv rather than spaces. git forbids spaces in
            # ref names, so this is defence in depth rather than a live bug --
            # but the failure it prevents is silent field-shifting, which is the
            # expensive kind to diagnose.
          done < <(echo "$prs" | jq -r '.[] | [.number, .headRefOid, .isDraft] | @tsv')

          echo "re-ran $rerun stale gate verdict(s); $errors PR(s) could not be examined"
          {
            echo "### Review gate unstick"
            echo
            echo "Re-asked **$rerun** stale verdict(s) across $count open pull request(s)."
            echo
            echo "A PR is re-asked only when it has zero unresolved threads, its"
            echo "latest gate run for the current head failed, and that failure"
            echo "includes a threads job."
            if [ "$errors" -gt 0 ]; then
              echo
              echo "**$errors pull request(s) could not be examined** because an API"
              echo "call failed. Their gate verdicts may still be stale."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors pull request(s) could not be examined; stale verdicts may remain"
            exit 1
          fi
