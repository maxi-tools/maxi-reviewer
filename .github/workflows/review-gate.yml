# maxi-config-owned Maxi review gate workflow.
# Source of truth: maxi-config/maxi-review/review-gate.yml
# Fanned out by scripts/sync-maxi-review.sh; edit it there, not here.
#
# Refuses a PR with unresolved review threads, or with no review from anyone
# other than its author.

name: Review Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  # Resolving a conversation emits NO pull_request or pull_request_review
  # event, and there is no Actions trigger that covers it. This previously
  # listed `pull_request_review_thread`, which is a webhook delivered to GitHub
  # Apps and NOT a valid workflow trigger: GitHub rejected the whole file with
  # "(Line: 19, Col: 3): Unexpected value 'pull_request_review_thread'", a
  # startup failure that created zero jobs. So from the day this gate was added
  # it never ran in ANY repo — nothing was enforcing unresolved threads or
  # non-author review anywhere in the org.
  #
  # The gap is real and is accepted deliberately: a gate that occasionally
  # needs a re-run beats one that never runs. After resolving the last thread,
  # re-run this check from the PR's checks tab, or push to the branch. Do not
  # re-add the trigger to close it — it invalidates the file.
  # A diff comment created straight through the review-comment API is not
  # submitted as a review, so it emits neither of the events above while
  # still opening a NEW unresolved thread -- a green check would stay
  # green. Deleting one can strand an old failure the same way. There is
  # no thread-created event, so this is the only trigger that covers it.
  #
  # It is also the highest-volume trigger by a wide margin: 30 of the 62
  # Review Gate runs in one repo in 24h. That cost is accepted rather than
  # optimised away. Skipping the evaluation on this event and leaving the
  # verdicts PENDING was tried on this branch and withdrawn: the required
  # checks aggregate across suites -- see the status publisher note in
  # review-gate-reusable.yml -- so a
  # pending-and-never-completed run is not neutral, and "re-run this check"
  # clears one entry in a rollup that has several. Every event that reaches
  # this gate now runs it to a verdict.
  pull_request_review_comment:
    types: [created, deleted]

# Without this, every trigger above stacks a run that is never superseded, and
# `pull_request_review_comment` fires once per individual comment. A reviewer
# filing eighteen comments in a round therefore queues eighteen gate runs, none
# of which cancels the others. Measured on maxi-config#412: 24 queued
# review-gate jobs on one SHA -- 12 copies of `resolve-review-threads` and 12 of
# `get-a-non-author-review` -- with not one of them started, on a self-hosted
# pool at zero idle. The gate could not reach a verdict because it was waiting
# behind eleven stale copies of itself.
#
# `maxi-review.yml` -- fanned out by the same script, from this directory -- has
# had this since it was written. This file never did.
#
# THIS BLOCK LIVES IN THE TEMPLATE, NOT ONLY IN maxi-config's applied copy.
# It was first added to `.github/workflows/review-gate.yml` alone, and the next
# fan-out (#436, "sync Maxi review workflows from maxi-config") copied this
# template straight over it and deleted all thirty lines -- in maxi-config and
# in every consumer at once. Re-measured after that revert: 73 queued runs org
# wide on SHAs that were no longer any branch tip or open-PR head, 10 of them
# `Review Gate`. tests/test_review_gate_workflow.py pins it here now.
#
# Cancelling is safe here, and the distinction matters: the approach withdrawn
# above left verdicts PENDING, which is not neutral in a rollup that aggregates
# across suites. A cancelled run is *terminal*, not pending. No `review-gate`
# context is in any repo's required set (checked across the org: rulesets
# require `merge-gate/*` only), so a cancelled check-run cannot block a merge,
# and the authoritative signal is the commit status the reusable workflow
# publishes, which is last-write-wins per context. The newest run always
# survives to write it.
#
# This also removes the reason for the soft-supersede branch in
# review-gate-reusable.yml ("run N started while M was publishing; yielding the
# context back to pending") -- that exists to compensate for stacking rather
# than prevent it. Leave it in place: it is now belt-and-braces, and removing it
# is a separate change that should be measured on its own.
concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review-gate:
    uses: maxi-tools/maxi-config/.github/workflows/review-gate-reusable.yml@main
    # `pull-requests: read` is what the gate actually spends: its two paginated
    # GraphQL queries read this PR's reviews and its review threads to decide
    # whether any thread is still unresolved. It only reads them — the verdict
    # is the job's own outcome, not a comment or a label — so write scope would
    # be strictly more than the gate can use.
    permissions:
      actions: read
      contents: read
      pull-requests: read
      # For the `review-gate` commit status the reusable workflow posts. This has to be
      # granted HERE: a reusable workflow cannot elevate the token its caller hands it,
      # so `statuses: write` in review-gate-reusable.yml alone buys nothing -- the POST
      # returns a permission error, continue-on-error swallows it, and the context is
      # never published at all. (codex P1, #378.)
      statuses: write
