# maxi-config-owned Maxi review gate workflow.
# Source of truth: maxi-config/maxi-review/review-gate.yml
# Fanned out by scripts/sync-maxi-review.sh; edit it there, not here.
#
# Refuses a PR with unresolved review threads, or with no review from anyone
# other than its author.

name: Review Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  # Resolving a conversation emits NO pull_request or pull_request_review
  # event. Without this trigger the check would stay red after the threads were
  # cleared, until something unrelated happened to re-run it, and people would
  # learn to ignore it. This is the trigger that closes the loop.
  pull_request_review_thread:
    types: [resolved, unresolved]
  # A diff comment created straight through the review-comment API is not
  # submitted as a review, so it emits neither of the events above while
  # still opening a NEW unresolved thread -- a green check would stay
  # green. Deleting one can strand an old failure the same way. There is
  # no thread-created event, so this is the only trigger that covers it.
  pull_request_review_comment:
    types: [created, deleted]

permissions: {}

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    uses: maxi-tools/maxi-config/.github/workflows/review-gate-reusable.yml@main
    permissions:
      contents: read
      pull-requests: read