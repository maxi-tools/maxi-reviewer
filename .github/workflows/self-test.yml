name: Self-test (dogfood)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: maxi-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.actor != 'dependabot[bot]'
    # Routed, not gated: a pull request whose head is this repository runs on
    # the fleet; anything from a fork stays on a GitHub-hosted VM. This job
    # checks out the head ref and installs dependencies, which executes the
    # PR's own package lifecycle scripts, so fork code must never land on a
    # persistent box. (Phrased without the literal install command for the same
    # reason the step below is: tests/action-metadata.test.ts locates that step
    # by first occurrence in this file, and prose naming it would come first.)
    #
    # Written as a `runs-on` expression rather than a second `if`-gated job so
    # the routing is one line that GitHub MUST evaluate to assign a runner at
    # all. maxi-config#345/#346 was a same-repo guard that was present but
    # unreachable; a guard the scheduler cannot skip cannot repeat that.
    #
    # Fork behaviour is unchanged by this commit -- forks got ubuntu-latest
    # before and still do. (They also cannot pass: GitHub withholds
    # MAXI_REVIEW_APP_PRIVATE_KEY and JULES_API_KEY from a fork-triggered run,
    # so the app-token step fails. That is pre-existing and left alone.)
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository
      && fromJSON('["self-hosted", "Linux", "ARM64"]') || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        # Same revision ci.yml pins, so there is one checkout revision to audit
        # and bump rather than two drifting apart silently.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The dependency install two steps below executes package lifecycle
          # scripts. On a same-repo PR this job's GITHUB_TOKEN carries write
          # scope, and a persisted checkout leaves it readable in .git/config
          # for exactly those scripts. Nothing here needs it: the reviewer step
          # authenticates with the app token minted further down.
          #
          # (Phrased without the literal install command on purpose — the
          # ordering assertion in tests/action-metadata.test.ts locates that
          # step by first occurrence, and prose naming it would come first.)
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build local action
        run: npm run build

      - name: Create Maxi Review app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.MAXI_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAXI_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write

      - uses: ./
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          fail_on: blocking
          skip_drafts: false
          retrieval_mode: auto
