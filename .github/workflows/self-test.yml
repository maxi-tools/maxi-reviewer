name: Self-test (dogfood)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: maxi-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build local action
        run: npm run build

      - name: Create Maxi Review app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MAXI_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAXI_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write

      - uses: ./
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          fail_on: blocking
          skip_drafts: false
          retrieval_mode: auto
