name: Self-test (dogfood)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Its OWN group, not maxi-review.yml's. They shared `maxi-review-<pr>`, and
# that workflow sets cancel-in-progress: true, so starting it evicted this one
# -- `cancel-in-progress: false` here governs what this workflow cancels, not
# whether it can be cancelled. 14 of the last 20 runs died that way, most
# before executing a step, which meant the dogfood lane usually did not run at
# all. It failed quietly too: a cancelled run shows in `gh pr checks` text mode
# as `fail`, indistinguishable from an ordinary red check (#108).
concurrency:
  group: self-test-${{ github.event.pull_request.number }}
  # Now that the group is ours, a superseded commit should not hold a slot --
  # the job cap below is 70 minutes.
  cancel-in-progress: true

jobs:
  # Named self-test, not review: maxi-review.yml's job is also `review`, so
  # both published a check by that name and a PR showed two `review` rows, one
  # green and one cancelled. Nothing requires this context -- the fleet ruleset
  # requires only `ci` -- so the rename costs nothing and makes the two lanes
  # tellable apart.
  self-test:
    if: github.actor != 'dependabot[bot]'
    # STILL HOSTED, deliberately, and not merely because forks exist.
    #
    # This job mints a MAXI_REVIEW_APP_PRIVATE_KEY app token and puts
    # JULES_API_KEY in scope, then builds the action FROM THE PULL REQUEST and
    # runs it as the local-action step at the bottom of this job. (Named that
    # way rather than by its `uses:` value, for the reason the checkout step
    # below already documents: tests/action-metadata.test.ts locates each step
    # by first occurrence in this file, so prose quoting one sorts ahead of the
    # step and inverts the ordering assertion. This comment did exactly that on
    # its first push -- "expected 514 to be greater than 2984".)
    # A same-repo/fork comparison does not cover
    # that: every same-repo pull request, from anyone with write access, also
    # carries author-controlled code, and here that code runs next to two
    # credentials. maxi-core#3913's review made this exact distinction -- a
    # fork guard suffices for a job that builds pull-request code with no
    # secrets, and does not for one holding a credential while doing it.
    #
    # The bar for such a job is an identity test (a `synchronize` sent by the
    # owner, or push/workflow_dispatch), not a repository comparison. Adopting
    # it here is a policy decision for this repo rather than a side effect of a
    # runner migration, so this lane stays where it is until that is taken
    # deliberately. ci.yml's `ci` job is the one that moved, and it holds no
    # app token.
    runs-on: ubuntu-latest
    # The outer runner-release watchdog README.md:174-180 asks for: the
    # action's own hard_timeout_minutes is enforced by in-process timers, which
    # a blocked Node event loop can stop from ever firing. Absent here until
    # now, so a hung dogfood run held a runner to the platform limit.
    timeout-minutes: 70
    permissions:
      pull-requests: write
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        # Same revision ci.yml pins, so there is one checkout revision to audit
        # and bump rather than two drifting apart silently.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The dependency install two steps below executes package lifecycle
          # scripts. On a same-repo PR this job's GITHUB_TOKEN carries write
          # scope, and a persisted checkout leaves it readable in .git/config
          # for exactly those scripts. Nothing here needs it: the reviewer step
          # authenticates with the app token minted further down.
          #
          # (Phrased without the literal install command on purpose — the
          # ordering assertion in tests/action-metadata.test.ts locates that
          # step by first occurrence, and prose naming it would come first.)
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build local action
        run: npm run build

      - name: Create Maxi Review app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.MAXI_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAXI_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write

      - uses: ./
        # README.md:174-180: the action's hard deadline is enforced by
        # in-process timers, and a blocked Node event loop stops them firing.
        # This outer bound is the real watchdog. 55 is the documented floor for
        # the default 30-minute Jules budget (a 50-minute process deadline plus
        # cleanup headroom); the job cap above it is 70.
        timeout-minutes: 55
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          fail_on: blocking
          skip_drafts: false
          retrieval_mode: auto
