# maxi-config-owned qlty configuration.
#
# RENDERED per repo from its GitHub languages by
# scripts/qlty_render.py -- this copy was generated, not copied.
#
# Do not edit this file here. Edit scripts/qlty_render.py in
# maxi-config and let the distributor deliver the result: the next
# fan-out overwrites this file byte for byte.
#
# Rendered for languages: JavaScript, Python, TypeScript
#
# Posture: plugins block by default with named exceptions, and
# [smells] is always monitor. `comment` is deliberately absent --
# the zero-unresolved-threads merge bar turns every comment into a
# merge gate, so the real choice is block or monitor.
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
# Always monitor, never comment or block. qlty Cloud posts smells
# once per touched LINE rather than once per function: one
# 7-parameter function drew 44 identical comments on maxi-core#3428,
# 339 smell comments in one PR. Every one of those is a thread and
# every thread is a merge gate.
mode = "monitor"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "editorconfig-checker"
mode = "monitor"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-python"
mode = "monitor"

[[plugin]]
name = "ripgrep"
mode = "monitor"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# indent_size only. The plugin cannot distinguish an aligned
# continuation from an indent level, and `mode = "monitor"` above
# does not stop it failing `qlty check` or the pre-push hook -- mode
# governs Cloud comments, triage governs whether the lane is green.
[[triage]]
match.plugins = ["editorconfig-checker"]
match.rules = ["editorconfig-checker:indent_size"]
set.ignored = true

# A harness that exercises a shell has to start one, and a test
# is made of asserts. These fire on the act of testing rather
# than on a defect. Production code that imports subprocess
# still blocks, which is the coverage worth keeping.
#
# B103 (chmod) is deliberately NOT here: a stub the test process
# executes needs the owner bit only, so `0o700` removes the
# finding at the source and leaves the rule guarding real
# permission mistakes.
[[triage]]
match.file_patterns = [
  "**/tests/**",
  "**/test/**",
  "**/test_*.py",
  "**/*_test.py",
  "**/conftest.py",
]
match.plugins = ["bandit"]
match.rules = [
  "bandit:B101",
  "bandit:B404",
  "bandit:B603",
  "bandit:B607",
]
set.ignored = true
