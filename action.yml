name: "Maxi Review"
description: "Review pull requests with Maxi analyzer context and Jules feedback."
author: "maxi-tools"

branding:
  icon: "check-circle"
  color: "purple"

inputs:
  jules_api_key:
    description: "Jules API key (create one at jules.google.com)."
    required: true
  github_token:
    description: "GitHub token with pull-requests:write and statuses:write for reviews, plus contents:write and issues:write for /maxi commands. Usually the default GITHUB_TOKEN secret."
    required: true
  fail_on:
    description: "When to fail the commit status check: never | blocking | any. Default blocking."
    required: false
    default: "blocking"
  skip_drafts:
    description: "Skip review on draft PRs."
    required: false
    default: "true"
  skip_forks:
    description: "Skip review on PRs from forks (prompt-injection risk)."
    required: false
    default: "true"
  bypass_label:
    description: "Label that, when applied to a PR, skips the review entirely."
    required: false
    default: "maxi-review-override"
  status_context:
    description: "Commit status context name."
    required: false
    default: "maxi/review"
  extra_instructions:
    description: "Free-form Markdown appended to the review prompt. Use to add project-specific rules, frameworks, or focus areas directly from the workflow."
    required: false
    default: ""
  rules_file:
    description: "Path (in the repo) to a Markdown file whose contents are injected into the prompt. Default .github/maxi-review-rules.md if it exists. Set to empty string to disable."
    required: false
    default: ".github/maxi-review-rules.md"
  timeout_minutes:
    description: "How long to wait for Jules to return a review before giving up. Default 30. Real reviews on non-trivial PRs often take 15-25 minutes; do not set below 20 or you will miss legitimate reviews."
    required: false
    default: "30"
  analyzer_mode:
    description: "Analyzer mode: auto runs Opengrep and PMD/CPD from PATH when no output files are configured; off skips analyzer execution and ingestion."
    required: false
    default: "auto"
  opengrep_json:
    description: "Optional path to Opengrep/Semgrep-compatible JSON output to ingest."
    required: false
    default: ""
  opengrep_sarif:
    description: "Optional path to Opengrep/Semgrep-compatible SARIF output to ingest."
    required: false
    default: ""
  pmd_xml:
    description: "Optional path to PMD XML output to ingest."
    required: false
    default: ""
  cpd_xml:
    description: "Optional path to CPD XML output to ingest."
    required: false
    default: ""
  command:
    description: "Maxi review command to run for workflow_dispatch, for example /maxi apply-all or /maxi fix <finding-id>."
    required: false
    default: ""
  pr_number:
    description: "Pull request number for workflow_dispatch command runs."
    required: false
    default: ""

runs:
  using: "node24"
  main: "dist/index.js"
