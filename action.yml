name: "Maxi Review"
description: "Review pull requests with Maxi analyzer context and Jules feedback."
author: "maxi-tools"

branding:
  icon: "check-circle"
  color: "purple"

inputs:
  jules_api_key:
    description: "Jules API key (create one at jules.google.com)."
    required: true
  github_token:
    description: "GitHub token with pull-requests:write, statuses:write, issues:read (the review fetches linked-issue acceptance criteria), and checks:read (when ci_signal is enabled) for reviews, plus contents:write and issues:write for /maxi commands. Usually the default GITHUB_TOKEN secret."
    required: true
  fail_on:
    description: "When to fail the commit status check: never | blocking | any. Default blocking."
    required: false
    default: "blocking"
  skip_drafts:
    description: "Skip review on draft PRs."
    required: false
    default: "true"
  skip_forks:
    description: "Skip review on PRs from forks (prompt-injection risk)."
    required: false
    default: "true"
  bypass_label:
    description: "Label that, when applied to a PR, skips the review entirely."
    required: false
    default: "maxi-review-override"
  status_context:
    description: "Commit status context name."
    required: false
    default: "maxi/review"
  extra_instructions:
    description: "Free-form Markdown appended to the review prompt. Use to add project-specific rules, frameworks, or focus areas directly from the workflow."
    required: false
    default: ""
  rules_file:
    description: "Path (in the repo) to a Markdown file whose contents are injected into the prompt. Default .github/maxi-review-rules.md if it exists. Set to empty string to disable."
    required: false
    default: ".github/maxi-review-rules.md"
  timeout_minutes:
    description: "How long to wait for Jules to return a review before giving up. Default 30. Real reviews on non-trivial PRs often take 15-25 minutes; do not set below 20 or you will miss legitimate reviews."
    required: false
    default: "30"
  analyzer_mode:
    description: "Analyzer mode: auto runs Opengrep and PMD/CPD from PATH when no output files are configured; off skips analyzer execution and ingestion."
    required: false
    default: "auto"
  opengrep_json:
    description: "Optional path to Opengrep/Semgrep-compatible JSON output to ingest."
    required: false
    default: ""
  opengrep_sarif:
    description: "Optional path to Opengrep/Semgrep-compatible SARIF output to ingest."
    required: false
    default: ""
  pmd_xml:
    description: "Optional path to PMD XML output to ingest."
    required: false
    default: ""
  cpd_xml:
    description: "Optional path to CPD XML output to ingest."
    required: false
    default: ""
  review_ignore_globs:
    description: "Newline- or comma-separated globs for generated/vendored paths to drop from the reviewed diff so the diff budget is spent on source (e.g. a bundled action's dist/). Empty uses a sensible default set (dist/**, *.map, lockfiles, **/generated/**); set to 'none' to disable filtering."
    required: false
    default: ""
  retrieval_mode:
    description: Agentic retrieval loop. auto lets the reviewer request read_file, grep, and list_references at the PR head before the verdict; off disables it.
    required: false
    default: 'off'
  dedupe_reviewers:
    description: "Dedupe against other review bots. auto fetches active non-self inline review comments (CodeRabbit, Codacy, Codex, ...) and tells the model not to restate them; off disables it."
    required: false
    default: "off"
  ci_signal:
    description: "Ingest CI evidence into the review. auto fetches the PR head check-runs (requires checks:read on github_token); off skips them. Supplied test_report/coverage_summary files are ingested regardless."
    required: false
    default: "off"
  test_report:
    description: "Optional path to a test report file (e.g. a JUnit or text summary) to ingest as CI evidence for the review."
    required: false
    default: ""
  coverage_summary:
    description: "Optional path to a coverage summary file (e.g. a coverage delta report) to ingest as CI evidence for the review."
    required: false
    default: ""
  command:
    description: "Maxi review command to run for workflow_dispatch, for example /maxi apply-all or /maxi fix <finding-id>."
    required: false
    default: ""
  pr_number:
    description: "Pull request number for workflow_dispatch command runs."
    required: false
    default: ""

outputs:
  review_artifacts:
    description: "JSON array of harvested maxi.review.v1.review-artifact objects from /maxi harvest."

runs:
  using: "node24"
  main: "dist/index.js"
