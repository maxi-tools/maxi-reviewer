name: Maxi Review (project rules)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Opengrep
        run: opengrep scan --json --output opengrep.json .
        continue-on-error: true

      - name: Run maxi-reviewer
        timeout-minutes: 55
        uses: maxi-tools/maxi-reviewer@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          opengrep_json: opengrep.json
          extra_instructions: |
            This repo is a Node/TypeScript service.

            Blocking rules specific to this codebase:
            - Any direct DB write outside `src/repositories/` is BLOCKING.
            - Logging of request bodies without `redactSecrets()` is BLOCKING.
            - Missing `await` on a returned Promise in an async handler is BLOCKING.

            Soft rules:
            - Prefer named exports — raise as NIT if default export.
            - New public functions without JSDoc — raise as WARN.

  command:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run maxi-reviewer
        timeout-minutes: 55
        uses: maxi-tools/maxi-reviewer@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
